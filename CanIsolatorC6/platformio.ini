; CanIsolator for the TechOverflow CANipulator (ESP32-C6-WROOM-1U, 4MB flash).
; Build/flash:  pio run -t upload      Monitor:  pio device monitor
; The sketch is CanIsolatorC6.ino in this folder, so it also opens in the
; Arduino IDE (board "ESP32C6 Dev Module", USB CDC On Boot: Enabled; the IDE
; picks up partitions.csv from the sketch folder by itself).
; Each build also copies the firmware to ../Firmware/CanIsolatorC6-<version>.bin
; for updating from the config tool.
[platformio]
src_dir = .

[env:canipulator]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
extra_scripts = post:copy_firmware.py
build_src_filter = +<*> -<.pio/>
monitor_speed = 115200
monitor_filters = direct
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
