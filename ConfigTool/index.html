    !has('chg') && state.connected ? h('p', { class: 'hint', style: 'color:var(--warn)' }, 'Needs isolator firmware 2.6 or newer.') : null,
    h('div', { class: 'toolbar' }, h('b', { style: 'margin-right:6px' }, 'Watch'), busBox(1, 'Bus A'), busBox(2, 'Bus B')),
    h('div', { class: 'chg-step' }, h('b', {}, '1 · Background'), h('div', {}, step1)),
    h('div', { class: 'chg-step' }, h('b', {}, '2 · Action'), h('div', {}, step2)),
    C.tries.length ? h('div', { style: 'margin-top:12px' },
      res.length ? h('div', { class: 'sniff-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Bus'), h('th', {}, 'ID'), h('th', {}, 'Message'), h('th', { class: 'num', title: 'In how many tries these bits changed' }, 'Tries'), h('th', {}, 'Changed bits (value now)'), h('th', {}, ''))),
        h('tbody', {}, rows)))
        : h('p', { class: 'muted' }, 'Nothing changed that doesn’t also change by itself. Try the action again, or record a shorter background.')) : null);
}

// ===========================================================================
// Record & replay
// ===========================================================================
const WHERE_CH = { 1: 'A RX', 2: 'B RX', 4: 'A TX', 8: 'B TX' };
const CANDUMP_CH = { 1: 'can0', 2: 'can1', 4: 'can0tx', 8: 'can1tx' };

async function recStart() {
  const R = state.rec;
  if (!state.connected) return;
  if (R.useMon) { if (!state.monFilters.length) { toast('The frame monitor has no filters. Add some there, or record everything.', true); return; } }
  else {
    if (!R.what) { toast('Tick at least one of A RX / B RX / A TX / B TX.', true); return; }
    if (state.monFilters.length && !(state.monFilters.length === 1 && state.monFilters[0].first === 0 && state.monFilters[0].last >= 0x1FFFFFFF && state.monFilters[0].where === R.what) &&
        !confirm('Recording everything replaces the frame monitor’s filters. Continue?')) return;
    state.monFilters = [{ where: R.what, ext: 2, first: 0, last: 0x1FFFFFFF }];
  }
  R.frames = []; R.lost = 0; R.wall0 = Date.now(); R.on = true; R.t0 = null;
  try {
    if (state.monOn) await monApply();
    else { await monApply(); state.monOn = true; state.monT0 = null; state.monFrames = []; state.monLost = 0; }
  } catch (e) { R.on = false; toast(e.message, true); }
  renderTab(false);
}
function recStop(msg) {
  const R = state.rec;
  if (!R.on) return;
  R.on = false;
  if (R.frames.length) {
    state.rp.file = { name: `Recording ${new Date(R.wall0).toLocaleTimeString()}`, ...framesToFile(R.frames.map(f => ({ t: f.t, ch: WHERE_CH[f.where], where: f.where, id: f.id, ext: f.ext, data: f.data }))) };
    rpDefaultMap();
  }
  if (msg) toast(msg, true);
  renderTab(false);
}
function recPush(frames, lost) {
  const R = state.rec;
  if (!R.on) return;
  for (const f of frames) R.frames.push(f);
  R.lost += lost;
  if (R.frames.length >= 2e6) recStop('Recording stopped at 2 million frames.');
}

function framesToFile(frames) {
  frames.sort((a, b) => a.t - b.t);
  const t0 = frames.length ? frames[0].t : 0;
  const chans = [];
  for (const f of frames) { f.t -= t0; if (!chans.includes(f.ch)) chans.push(f.ch); }
  // Which bus a channel belongs to (for graphs): our labels say; otherwise first = A, second = B.
  const whereOf = {};
  chans.forEach((c, i) => { const w = Object.entries(WHERE_CH).find(([, n]) => n === c); whereOf[c] = w ? +w[0] : i === 0 ? 1 : i === 1 ? 2 : 0; });
  for (const f of frames) if (f.where === undefined) f.where = whereOf[f.ch];
  const counts = {}; for (const f of frames) counts[f.ch] = (counts[f.ch] || 0) + 1;
  return { frames, chans, counts, dur: frames.length ? frames[frames.length - 1].t : 0 };
}

function saveCandump(frames, wall0) {
  if (!frames.length) return;
  const t0 = frames[0].t, base = wall0 / 1000;
  const lines = frames.map(f => `(${(base + f.t - t0).toFixed(6)}) ${CANDUMP_CH[f.where] || 'can' + f.where} ${hex(f.id, f.ext)}#${f.data}`);
  downloadText(lines.join('\n') + '\n', `can-recording-${stamp()}.log`);
}
function saveCsv(frames) {
  const t0 = frames.length ? frames[0].t : 0;
  const lines = ['time_s,where,id,extended,len,data'];
  for (const f of frames) lines.push(`${(f.t - t0).toFixed(4)},${WHERE[f.where]},0x${hex(f.id, f.ext)},${f.ext},${f.data.length / 2},${spaced(f.data)}`);
  downloadText(lines.join('\n') + '\n', `can-recording-${stamp()}.csv`, 'text/csv');
}

// Log files: candump -l, this tool's CSV, SavvyCAN CSV, Vector ASC.
function parseLog(text) {
  const lines = text.split(/\r?\n/);
  const out = [];
  const head = lines.find(l => l.trim()) || '';
  const cleanHex = (s) => s.replace(/[^0-9a-f]/gi, '').toUpperCase();
  if (/^time_s,where,id,extended/i.test(head.trim())) {
    for (const l of lines.slice(1)) {
      const c = l.split(','); if (c.length < 6) continue;
      const id = parseHex(c[2]); if (!Number.isFinite(id)) continue;
      out.push({ t: +c[0], ch: c[1].trim(), id, ext: +c[3] ? 1 : 0, data: cleanHex(c[5]).slice(0, 16) });
    }
  } else if (/^time stamp\s*,/i.test(head.trim())) {
    const cols = head.split(',').map(s => s.trim().toLowerCase());
    const ci = (n) => cols.indexOf(n);
    const iT = ci('time stamp'), iId = ci('id'), iExt = ci('extended'), iBus = ci('bus'), iLen = ci('len'), iD1 = ci('d1');
    for (const l of lines.slice(lines.indexOf(head) + 1)) {
      const c = l.split(','); if (c.length < 4) continue;
      const id = parseHex(c[iId]); if (!Number.isFinite(id)) continue;
      const len = Math.min(8, +c[iLen] || 0);
      const data = Array.from({ length: len }, (_, k) => cleanHex(c[iD1 + k] || '0').padStart(2, '0').slice(-2)).join('');
      out.push({ t: +c[iT] / 1e6, ch: 'bus ' + (iBus >= 0 ? c[iBus].trim() : '0'), id, ext: /true|1/i.test(c[iExt]) || id > 0x7FF ? 1 : 0, data });
    }
  } else {
    let asc = false, dec = false;
    for (const raw of lines) {
      const l = raw.trim();
      let m;
      if ((m = /^\((\d+(?:\.\d+)?)\)\s+(\S+)\s+([0-9A-Fa-f]{1,8})#(R\d*|[0-9A-Fa-f]*)$/.exec(l))) {
        if (m[4].startsWith('R')) continue;
        out.push({ t: +m[1], ch: m[2], id: parseInt(m[3], 16), ext: m[3].length > 3 ? 1 : 0, data: m[4].toUpperCase().slice(0, 16) });
      } else if (/^base\s+(hex|dec)/i.test(l)) { asc = true; dec = /dec/i.test(l); }
      else if ((m = /^(\d+\.\d+)\s+(\d+)\s+([0-9A-Fa-f]+)(x?)\s+(Rx|Tx)\s+d\s+(\d+)((?:\s+[0-9A-Fa-f]{1,2})*)/.exec(l))) {
        asc = true;
        const id = dec ? parseInt(m[3], 10) : parseInt(m[3], 16);
        const bytes = m[7].trim().split(/\s+/).filter(Boolean).slice(0, Math.min(8, +m[6]));
        out.push({ t: +m[1], ch: `CH${m[2]} ${m[5]}`, id, ext: m[4] === 'x' || id > 0x7FF ? 1 : 0, data: bytes.map(b => b.padStart(2, '0')).join('').toUpperCase() });
      }
    }
  }
  if (!out.length) throw new Error('no CAN frames found (supported: candump -l logs, CSV from this tool or SavvyCAN, Vector .asc)');
  return framesToFile(out);
}

function rpDefaultMap() {
  const P = state.rp, F = P.file;
  P.map = {};
  F.chans.forEach((c, i) => {
    P.map[c] = /TX$/i.test(c) && !/^CH/i.test(c) ? 'skip' : c === 'A RX' ? '2' : c === 'B RX' ? '3' : i === 0 ? '2' : i === 1 ? '3' : 'skip';
  });
}

async function rpLoadFile(file) {
  try {
    const text = await file.text();
    state.rp.file = { name: file.name, ...parseLog(text) };
    rpDefaultMap();
    toast(`Loaded ${file.name}: ${state.rp.file.frames.length.toLocaleString()} frames, ${fmtDur(Math.round(state.rp.file.dur * 1000))}.`);
  } catch (e) { toast(`${file.name}: ${e.message}`, true); }
  renderTab(false);
}

function parseIdList(s) {
  const out = [];
  for (const part of s.split(/[\s,;]+/).filter(Boolean)) {
    const [a, b] = part.split('-');
    const x = parseId(a), y = b !== undefined ? parseId(b) : x;
    if (!Number.isFinite(x) || !Number.isFinite(y) || y < x) return null;
    out.push([x, y]);
  }
  return out;
}

function rpBuild() {
  const P = state.rp, F = P.file;
  const from = P.from.trim() ? Number(P.from) : 0, to = P.to.trim() ? Number(P.to) : Infinity;
  const ids = P.ids.trim() ? parseIdList(P.ids) : null;
  if (P.ids.trim() && !ids) throw new Error('The ID list isn’t valid: use IDs or ranges like 640, 2B2, 100-1FF');
  const inList = (id) => ids.some(([a, b]) => id >= a && id <= b);
  const list = [];
  for (const f of F.frames) {
    const mode = P.map[f.ch];
    if (mode === undefined || mode === 'skip' || f.t < from || f.t > to) continue;
    if (ids && (P.idMode === 'only') !== inList(f.id)) continue;
    list.push({ t: f.t, mode: +mode, id: f.id, ext: f.ext, data: f.data });
  }
  if (!list.length) return list;
  const t0 = list[0].t;
  for (const x of list) x.t = (x.t - t0) / P.speed;
  return list;
}

async function rpStart() {
  const P = state.rp;
  if (!has('rp')) { toast('Replay needs isolator firmware 2.6 or newer (More… → Update firmware).', true); return; }
  let list;
  try { list = rpBuild(); } catch (e) { toast(e.message, true); return; }
  if (!list.length) { toast('Nothing to replay with these choices.', true); return; }
  if (list.some(x => x.mode < 2) && !confirmSend()) return;
  Object.assign(P, { list, dur: list[list.length - 1].t, idx: 0, loopN: 0, offset: 0, running: true, endSent: false, status: null, goSent: false, free: (state.hello.rpRing || 1024) - 1, t0: Date.now() });
  try {
    await lockedBg(() => requestOk('rp start'));
    await rpPump(true);
    P.status = await lockedBg(() => requestOk('rp go'));
    P.goSent = true;
  } catch (e) { P.running = false; toast('Replay: ' + e.message, true); renderTab(false); return; }
  clearInterval(P.timer); P.timer = setInterval(rpPump, 100);
  renderTab(false);
}

async function rpStop(quiet) {
  const P = state.rp;
  clearInterval(P.timer); P.timer = null;
  const was = P.running; P.running = false;
  if (was && state.connected) { try { await lockedBg(() => requestOk('rp off')); } catch {} }
  if (!quiet) renderTab(false);
}

let rpPumping = false;
async function rpPump(first) {
  const P = state.rp;
  if (rpPumping || !P.running || !state.connected) return;
  rpPumping = true;
  try {
    let lines = 0;
    while (P.free > 40 && lines < (first ? 60 : 30)) {
      if (P.idx >= P.list.length) {
        if (P.loop) { P.idx = 0; P.loopN++; P.offset += P.dur + 0.05; continue; }
        if (!P.endSent) { P.status = await lockedBg(() => requestOk('rp end')); P.endSent = true; }
        break;
      }
      let line = 'rpa', n = 0;
      const start = P.idx;
      while (P.idx < P.list.length && line.length < 900 && n < P.free) {
        const f = P.list[P.idx];
        line += ` ${Math.round((f.t + P.offset) * 10000).toString(16)},${f.mode},${f.id.toString(16)},${f.ext},${f.data}`;
        P.idx++; n++;
      }
      const r = await lockedBg(() => requestOk(line));
      P.free = r.free; P.status = r;
      if (r.n < n) P.idx = start + r.n;              // board was full: the rest goes next time
      lines++;
    }
    if (!lines && (!P.statAt || Date.now() - P.statAt > 400)) { P.status = await lockedBg(() => requestOk('rp')); P.free = P.status.free; P.statAt = Date.now(); }
    if (P.status && !P.status.on) { P.running = false; clearInterval(P.timer); toast('The isolator stopped the replay.', true); }
    else if (P.goSent && P.endSent && P.status && !P.status.run) { P.running = false; clearInterval(P.timer); toast(`Replay finished: ${P.status.sent.toLocaleString()} frames.`); }
  } catch (e) { toast('Replay: ' + e.message, true); rpStop(true); }

function canon(m) {
  const c = JSON.parse(JSON.stringify(m, (k, v) => k.startsWith('_') ? undefined : v));
  const fr = (o) => { for (const k of ['factor', 'offset']) if (typeof o[k] === 'number') o[k] = Math.fround(o[k]); };

  for (const x of c.xforms || []) x.ops.forEach(fr);
  return c;
}
function xfName(m, xf) {
  if (!xf) return '';
  const base = state.hello?.xfCustom ?? 2;
  if (xf < base) return XF_LABEL[state.hello?.xf?.[xf]] || 'built-in transform ' + xf;
  const x = (m.xforms || [])[xf - base];
  return `transform “${x ? x.name || 'Transform ' + (xf - base + 1) : '#' + (xf - base + 1)}”`;
}
function routeHead(r) {

  return `${ids}${r.ext ? ' (29-bit)' : ''} ${DIR_LABEL[r.dir] || ''}`;
}
function routeAction(m, r) {

  let s = 'pass';
  if (r.xf) s += ' through ' + xfName(m, r.xf);
  if (r.minMs) s += `, at most every ${r.minMs} ms`;
  if (r.onChange) s += ', only when the data changes' + (r.hbMs ? ` (and every ${r.hbMs} ms)` : '');
  return s;
}
const yn = (v) => v ? 'on' : 'off';
const SETTING_DIFFS = [
  ['Bus A bit rate', m => m.baud[0], v => v / 1000 + ' kbit/s'], ['Bus B bit rate', m => m.baud[1], v => v / 1000 + ' kbit/s'],
  ['Connectors swapped', m => m.swap, v => v ? 'yes' : 'no'],
  ['Unrouted A → B', m => m.def[0], v => v ? 'pass' : 'drop'], ['Unrouted B → A', m => m.def[1], v => v ? 'pass' : 'drop'],
  ['TX max age', m => m.txMaxAge, v => v + ' ms'], ['Button timeout', m => m.btnStale, v => v + ' ms'],
  ['Buttons frame ID', m => m.btnId * 2 + m.btnExt, (v) => fmtId(v >> 1, v & 1) + (v & 1 ? ' (29-bit)' : '')],
  ['Bus A hardware filter', m => m.hwFilterA ?? 1, yn],

function diffModels(a, b) {

  const key = (r) => `${r.first}:${r.last && r.last !== r.first ? r.last : r.first}:${r.ext}:${r.dir}`;
  const pool = new Map();

  const items = [], pairs = [];

      if ((o.note || '') !== (r.note || '')) ch.push(`note “${o.note || ''}” → “${r.note || ''}”`);
      if (ch.length) items.push({ k: 'chg', text: `${routeHead(r)}: ${ch.join('; ')}` });
    } else items.push({ k: 'add', text: `New row ${j + 1}: ${routeHead(r)} ${routeAction(b, r)}${r.note ? ` — “${r.note}”` : ''}` });
  });

      ...(A.filter(x => B.includes(x)).length === A.length && B.length === A.length ? [{ k: 'chg', text: 'Row order changed' }] : [])]);

  const named = (list, nameOf) => { const m = new Map(); list.forEach((x, i) => { let k = nameOf(x) || '#' + i; while (m.has(k)) k += '′'; m.set(k, x); }); return m; };
  {
    const A = named(a.gens || [], g => g.name), B = named(b.gens || [], g => g.name), it = [];
    for (const [k, g] of B) {
      const o = A.get(k);
      if (!o) { it.push({ k: 'add', text: `New: “${g.name}” ${fmtId(g.id, g.ext)} on Bus ${g.bus ? 'B' : 'A'} every ${g.period} ms, ${g.on ? 'on' : 'off'}` }); continue; }
      const d = [];
      if (o.on !== g.on) d.push(g.on ? 'turned on' : 'turned off');
      if (o.id !== g.id || o.ext !== g.ext) d.push(`ID ${fmtId(o.id, o.ext)} → ${fmtId(g.id, g.ext)}`);
      if (o.bus !== g.bus) d.push(`sent on Bus ${o.bus ? 'B' : 'A'} → ${g.bus ? 'B' : 'A'}`);
      if (o.period !== g.period) d.push(`every ${o.period} → ${g.period} ms`);
      if (o.len !== g.len) d.push(`length ${o.len} → ${g.len}`);
      if (JSON.stringify(o.base) !== JSON.stringify(g.base)) d.push('constant bytes changed');
      if (JSON.stringify(o.sig) !== JSON.stringify(g.sig)) d.push(o.sig.length !== g.sig.length ? `fields ${o.sig.length} → ${g.sig.length}` : 'fields changed');
      if (d.length) it.push({ k: 'chg', text: `“${g.name}”: ${d.join('; ')}` });
    }
    for (const [k, g] of A) if (!B.has(k)) it.push({ k: 'del', text: `Removed: “${g.name}” ${fmtId(g.id, g.ext)}` });
    add('Generated frames', it);
  }
  {
    const A = named(a.xforms || [], x => x.name), B = named(b.xforms || [], x => x.name), it = [];
    for (const [k, x] of B) {
      const o = A.get(k);
      if (!o) it.push({ k: 'add', text: `New: “${x.name}” (${x.ops.length} steps)` });
      else if (JSON.stringify(o.ops) !== JSON.stringify(x.ops)) it.push({ k: 'chg', text: `“${x.name}”: ` + (o.ops.length !== x.ops.length ? `${o.ops.length} → ${x.ops.length} steps` : 'steps changed') });
    }
    for (const [k, x] of A) if (!B.has(k)) it.push({ k: 'del', text: `Removed: “${x.name}”` });
    add('Transforms', it);
  }
  return groups;
}

function reviewDialog({ title, intro, groups, ok, sendToggle }) {
  return new Promise((resolve) => {
    const dlg = $('#reviewDlg');
    const n = groups ? groups.reduce((a, g) => a + g.items.length, 0) : 0;
    const body = groups === null ? null
      : n ? groups.map(g => h('div', { class: 'rv-group' }, h('h3', {}, g.title),
          h('ul', {}, g.items.map(x => h('li', { class: 'rv-' + x.k }, h('span', { class: 'rv-mark', 'aria-hidden': 'true' }, x.k === 'add' ? '+' : x.k === 'del' ? '−' : '~'), ' ', h('span', { class: 'sr' }, x.k === 'add' ? 'Added: ' : x.k === 'del' ? '' : 'Changed: '), x.text)))))
        : h('p', { class: 'muted' }, 'No differences.');
    const done = (v) => { dlg.close(); resolve(v); };
    dlg.replaceChildren(
      h('h2', {}, title),
      h('p', { class: 'hint' }, intro),
      h('div', { class: 'rv-body' }, body),
      sendToggle ? h('label', { class: 'hint', style: 'display:block;margin:10px 0 0' }, h('input', { type: 'checkbox', checked: localStorage.getItem('isolator-review-send') === '1',
        onchange: (e) => localStorage.setItem('isolator-review-send', e.target.checked ? '1' : '0') }), ' Also show this before every “Send to board”') : null,
      h('div', { class: 'toolbar', style: 'justify-content:flex-end;margin:14px 0 0' },
        h('button', { onclick: () => done(false) }, ok ? 'Cancel' : 'Close'),
        ok ? h('button', { class: 'primary', onclick: () => done(true) }, ok) : null));
    dlg.onclose = () => resolve(false);
    dlg.showModal();
  });
}

async function reviewForSave() {
  const next = state.editDirty ? state.edit : fromBoard(state.board);
  let groups = null, intro;
  if (has('getsaved')) {
    let s = null;
    try { s = await cmd.getSaved(); } catch (e) { toast(e.message, true); }
    if (s && !s.none) { groups = diffModels(fromBoard(s), next); intro = 'Differences between the settings saved on the board and what will be saved now.'; }
    else if (s) intro = s.bad ? 'The settings saved on the board are damaged or from an unknown version, so the board runs the factory defaults. Saving replaces them with everything in this page.'
                              : 'Nothing is saved on the board yet (it starts on the factory defaults). Saving stores everything in this page.';
    else intro = 'Couldn’t read the saved settings. Saving stores everything in this page.';
  } else {
    groups = diffModels(fromBoard(state.board), next);
    intro = 'This firmware can’t report its saved settings, so these are the differences from what the board is running now.';
  }
  return reviewDialog({ title: 'Save to board', intro, groups, ok: 'Save', sendToggle: true });
}

async function reviewForSend(always) {
  if (!always && localStorage.getItem('isolator-review-send') !== '1') return true;
  return reviewDialog({ title: 'Send to board', intro: 'Differences between what the board is running now and this page. Send runs them straight away (not saved).',
    groups: diffModels(fromBoard(state.board), state.edit), ok: 'Send', sendToggle: true });
}

// ===========================================================================
// File export / import
// ===========================================================================
function exportFile() {
  closeMenu();
  const data = { format: 'CanIsolatorC6-settings', version: 1, saved: new Date().toISOString(), firmware: state.hello ? state.hello.ver : null, settings: state.edit, signals: sigStore };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `isolator-settings-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.format !== 'CanIsolatorC6-settings' || !data.settings) throw new Error('Not an isolator settings file');
    const s = data.settings;
    const need = ['baud', 'swap', 'def', 'txMaxAge', 'btnStale', 'btnId', 'btnExt', 'btn', 'routes'];
    for (const k of need) if (!(k in s)) throw new Error('Settings file is missing "' + k + '"');
    if (s.hwFilterA === undefined) s.hwFilterA = 1;
    if (!Array.isArray(s.xforms)) s.xforms = [];
    if (!Array.isArray(s.gens)) {
      // File from firmware 2.0/2.1: generated frames were fixed, only switched on/off by a bit mask.
      const cur = state.edit?.gens || state.board && fromBoard(state.board).gens || [];
      s.gens = JSON.parse(JSON.stringify(cur));
      if (typeof s.gen === 'number') s.gens.forEach((g, i) => { if (i < 8) g.on = (s.gen >> i) & 1; });
      delete s.gen;
    }
    state.edit = JSON.parse(JSON.stringify(s));
    if (data.signals && typeof data.signals === 'object') { Object.assign(sigStore, data.signals); saveSigStore(); }
    state.editDirty = true;
    toast(state.connected ? 'Loaded. Review it, then Send or Save to the board.' : 'Loaded for offline editing. Connect to send it to a board.');
    render();
  } catch (e) { toast('Import failed: ' + e.message, true); }
}

// ===========================================================================
// Wiring
// ===========================================================================
$('#numFmt').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setNumFmt(b.dataset.f); });
$('#btnConnect').addEventListener('click', () => state.connected ? disconnect() : connect());
$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab === 'help') { openHelp(state.tab === 'help' ? 'start' : HELP_FOR_TAB[state.tab]); return; }
  state.tab = t.dataset.tab; renderTab(false);
});
$('#btnSend').addEventListener('click', () => actSend());
$('#btnReview').addEventListener('click', async () => { if (await reviewForSend(true)) actSend(true); });
$('#btnSave').addEventListener('click', actSave);
$('#btnDiscard').addEventListener('click', actDiscard);
$('#btnExport').addEventListener('click', exportFile);
$('#btnImport').addEventListener('click', () => { closeMenu(); $('#fileInput').click(); });
$('#fileInput').addEventListener('change', (e) => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; });
$('#btnRevert').addEventListener('click', () => actBoard('revert', 'Board is back on its saved settings.', 'Throw away the board’s unsaved settings and go back to what is saved in flash?'));
$('#btnDefaults').addEventListener('click', () => actBoard('defaults', 'Board is running the factory defaults (not saved).', 'Run the factory default settings now? (Saved settings are kept until you Save.)'));
$('#btnErase').addEventListener('click', () => actBoard('erase', 'Saved settings erased. The board uses factory defaults from the next restart.', 'Erase the settings saved on the board? It will start with the factory defaults next time.'));
$('#btnFirmware').addEventListener('click', () => { closeMenu(); state.tab = 'firmware'; renderTab(false); });
$('#btnReboot').addEventListener('click', () => actBoard('reboot', '', 'Restart the isolator? CAN forwarding stops for about half a second.'));
// "?" opens help for the current tab (not while typing in a field).
document.addEventListener('keydown', (e) => {
  if (e.key !== '?' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  if (state.tab === 'help') { state.tab = helpBackTab || 'status'; renderTab(false); } else openHelp(HELP_FOR_TAB[state.tab]);
});
window.addEventListener('beforeunload', (e) => { if (state.editDirty) { e.preventDefault(); e.returnValue = ''; } });

// Imported file in offline mode: show the editor without hello data.
render();
</script>
