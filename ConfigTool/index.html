<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN Isolator Config</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --ink: #111827; --muted: #4a5563; --line: #d3d9e1;
    --accent: #1d5bd6; --accent-ink: #ffffff; --link: #1d5bd6; --ok: #157a42; --warn: #9a5b00; --bad: #b42323;
    --ok-bg: #e3f4ea; --warn-bg: #fdf0d8; --bad-bg: #fbe5e5; --chip: #e9edf2; --input: #ffffff;
    --th-bg: #f4f6f9; --hdr-bg: linear-gradient(180deg, #ffffff 0%, #f3f6fb 100%);
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .05);
    --busA: #2f6fd6; --busB: #d9822b; --iso: #a3263f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1115; --panel: #181c22; --ink: #f1f4f8; --muted: #aeb9c6; --line: #323943;
      --accent: #6ea2ff; --accent-ink: #0b1220; --link: #8fb8ff; --ok: #5fd394; --warn: #f0b45a; --bad: #ff8a8a;
      --ok-bg: #15301f; --warn-bg: #3a2a10; --bad-bg: #3d1a1a; --chip: #262c35; --input: #11151a;
      --th-bg: #1d222a; --hdr-bg: linear-gradient(180deg, #1b2029 0%, #161a20 100%);
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
      --busA: #5b93ec; --busB: #c97f2e; --iso: #c94a63;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* our display rules must not override the hidden attribute */
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 10px; background: var(--panel); color: var(--muted); }
  .seg button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  button.small { padding: 2px 7px; font-size: 12.5px; white-space: nowrap; }
  nav { display: flex; gap: 2px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: var(--hdr-h, 57px); z-index: 4; }
  nav button { border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 14px; background: none; color: var(--muted); }
  nav button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 20px; max-width: 1500px; margin: 0 auto; padding-bottom: 90px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 4px; }
  .panel p.hint, .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 14px; margin-top: 10px; }
  .kv div span { display: block; color: var(--muted); font-size: 12px; }
  .kv div b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kv div b.small { font-size: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 4px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.drop td { background: color-mix(in srgb, var(--bad-bg) 45%, transparent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12.5px; white-space: pre; }
  input, select { font: inherit; color: var(--ink); background: var(--input); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
  input.bad { border-color: var(--bad); background: var(--bad-bg); }
  input.id { width: 88px; font-family: var(--mono); }
  input.ms { width: 58px; text-align: right; }
  input.note { width: 100%; min-width: 180px; }
  input.byte { width: 54px; }
  input[type=checkbox] { width: 16px; height: 16px; vertical-align: middle; }
  .warnings { font-size: 12px; max-width: 170px; }
  .warnings .w { color: var(--warn); display: block; }
  .warnings .e { color: var(--bad); display: block; font-weight: 600; }
  .row-tools { white-space: nowrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .field { display: grid; grid-template-columns: 220px 1fr; gap: 6px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: none; }
  .field label { font-weight: 550; }
  .field .hint { margin: 0; grid-column: 2; }
  .restart-tag { font-size: 11.5px; color: var(--warn); margin-left: 6px; font-weight: 500; }
  .actionbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 10px; align-items: center; z-index: 5; flex-wrap: wrap; }
  .actionbar .msg { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty h2 { color: var(--ink); }
  .toast { position: fixed; right: 20px; bottom: 70px; max-width: 460px; padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 4px 18px rgba(0,0,0,.25); z-index: 10; font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--bad); color: #fff; }
  .badge { white-space: nowrap; display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--chip); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .sniff-wrap { max-height: 560px; overflow: auto; }
  .muted { color: var(--muted); }
  details.more { position: relative; }
  details.more summary { list-style: none; cursor: pointer; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more .menu { position: absolute; bottom: 40px; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 250px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  details.more .menu button { text-align: left; border: none; }
  details.more .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .unsupported { max-width: 640px; margin: 80px auto; }
  :root { --f1: #2f6fd6; --f2: #d9822b; --f3: #14a38b; --f4: #b8459a; }
  @media (prefers-color-scheme: dark) { :root { --f1: #5b93ec; --f2: #e8a052; --f3: #3cc9ae; --f4: #d66bbd; } }
  .gen-cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 18px; align-items: start; margin-top: 8px; }
  @media (max-width: 1150px) { .gen-cols { grid-template-columns: minmax(0, 1fr); } }
  .field-card { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .field-card .toolbar { margin-bottom: 0; }
  .swatch { display: inline-flex; width: 20px; height: 20px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; }
  input.num { width: 118px; text-align: right; }
  details.units summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  details.units .units-body { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 0; font-size: 13px; }
  table.small-bits td.bit { width: 28px; height: 24px; }
  .bar { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; max-width: 520px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  nav .help-tab { margin-left: auto; color: var(--accent); font-weight: 600; }
  .help-wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .help-wrap { grid-template-columns: minmax(0, 1fr); } .help-toc { position: static !important; } }
  .help-toc { position: sticky; top: 112px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: calc(100vh - 220px); overflow: auto; }
  .help-toc input { width: 100%; margin-bottom: 8px; }
  .help-toc a { display: block; padding: 3px 6px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
  .help-toc a:hover { background: var(--chip); }
  .help-toc a.dim { opacity: .35; }
  .help-group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 2px; }
  .help-sec { line-height: 1.6; scroll-margin-top: 120px; }
  .help-sec p, .help-sec li { max-width: 860px; }
  .help-sec h4 { margin: 16px 0 4px; }
  .help-sec code, .help-sec kbd { font-family: var(--mono); font-size: 12.5px; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  .help-sec.flash { outline: 2px solid var(--accent); }
  .help-table { max-width: 860px; margin: 8px 0; }
  .help-table td, .help-table th { vertical-align: top; }
  .callout { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 8px 12px; border-radius: 6px; margin: 10px 0; max-width: 860px; }
  .callout.warn { border-left-color: var(--warn); background: var(--warn-bg); }
  .help-diagram { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; margin: 10px 0; max-width: 860px; }
  .hd-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 150px; font-weight: 600; background: var(--panel); }
  .hd-box small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .hd-box { flex: 1; min-width: 0; }
  .hd-arrow { display: flex; align-items: center; font-size: 22px; color: var(--accent); }
  .help-bits { display: flex; gap: 28px; flex-wrap: wrap; margin: 8px 0; }
  .help-grid { width: auto; border-collapse: separate; border-spacing: 2px; margin-top: 6px; }
  .help-grid th { font-weight: 500; padding: 0 4px; border: none; text-align: center; }
  .help-grid td { width: 30px; height: 24px; text-align: center; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0; color: var(--muted); }
  .help-grid td.on { background: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--ink); font-weight: 700; }
  .help-grid td.st { outline: 2px solid var(--accent); outline-offset: -2px; }
  .help-dl dt { font-weight: 600; margin-top: 8px; } .help-dl dd { margin: 2px 0 0 0; color: var(--ink); max-width: 860px; }
  .ledsw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  mark { background: color-mix(in srgb, var(--warn) 45%, transparent); color: inherit; border-radius: 2px; }
  .msgname { font-size: 12px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dbc-msg { border-top: 1px solid var(--line); padding: 10px 0; }
  table.dbc-sigs td { border: none; padding: 2px 8px 2px 0; font-size: 13px; }
  .mon-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1150px) { .mon-cols { grid-template-columns: minmax(0, 1fr); } }
  .chg { color: var(--accent); font-weight: 700; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--chip); }
  tr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  table.bits { width: auto; border-collapse: separate; border-spacing: 3px; }
  table.bits th { padding: 2px 4px; font-weight: 500; text-align: center; border: none; }
  table.bits td { border: 1px solid var(--line); border-radius: 4px; padding: 0; }
  td.bit { width: 34px; height: 28px; text-align: center; font-family: var(--mono); cursor: pointer; user-select: none; }
  td.bit:hover { border-color: var(--accent); }
  td.bit.insig { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
  td.bit.msb { box-shadow: inset 3px 0 0 var(--accent); }
  td.bit.anchor { outline: 2px dashed var(--warn); outline-offset: -2px; }
  .chart-wrap { position: relative; margin-top: 10px; }
  .chart-title { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .axis { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  svg.chart .series { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  svg.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  :root { --s1: #2f6fd6; --s2: #d9822b; }
  @media (prefers-color-scheme: dark) { :root { --s1: #5b93ec; --s2: #c97f2e; } }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  svg.chart .dlabel { fill: var(--ink); font-size: 11.5px; font-family: system-ui, sans-serif; }
  .chg-step { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  table.chgbits { width: auto; border-collapse: separate; border-spacing: 2px; }
  table.chgbits th { border: none; padding: 0 6px 0 0; font-weight: 500; }
  table.chgbits td.cb { width: 22px; height: 20px; text-align: center; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 3px; padding: 0; color: var(--muted); }
  table.chgbits td.cb.on { background: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--ink); font-weight: 700; }
  .graph-card { padding: 12px 16px; }
  .graph-now { font-variant-numeric: tabular-nums; font-size: 16px; }
  dialog#reviewDlg { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px 20px; width: min(760px, 92vw); max-height: 85vh; overflow: auto; }
  dialog#reviewDlg::backdrop { background: rgba(0,0,0,.35); }
  dialog#reviewDlg h2 { margin: 0 0 6px; font-size: 17px; }
  .rv-group h3 { font-size: 13.5px; margin: 12px 0 4px; }
  .rv-group ul { margin: 0; padding-left: 0; list-style: none; }
  .rv-group li { padding: 3px 0 3px 4px; font-size: 13.5px; }
  .rv-mark { display: inline-block; width: 16px; font-weight: 700; font-family: var(--mono); }
  .rv-add .rv-mark { color: var(--ok); } .rv-del .rv-mark { color: var(--bad); } .rv-chg .rv-mark { color: var(--warn); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tip { position: absolute; background: var(--ink); color: var(--bg); font-size: 12px; padding: 3px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  /* ---- theme ---- */
  a { color: var(--link); text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { background: var(--hdr-bg); border-top: 3px solid var(--accent); }
  header h1 { display: flex; align-items: center; gap: 9px; font-size: 16.5px; letter-spacing: -.01em; }
  header h1 svg { flex: none; }
  nav button:hover { color: var(--ink); background: var(--chip); }
  nav button.active { color: var(--accent); border-bottom-width: 3px; }
  .panel { box-shadow: var(--shadow); }
  .panel h2 { font-size: 15.5px; font-weight: 650; }
  th { background: var(--th-bg); }
  button.primary { box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button:hover:not(:disabled):not(.primary) { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .badge { font-weight: 600; }
  .actionbar { box-shadow: 0 -2px 10px rgba(0,0,0,.08); }
  .panel.bus-a { border-left: 4px solid var(--busA); }
  .panel.bus-b { border-left: 4px solid var(--busB); }
  .busdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .busdot.a { background: var(--busA); } .busdot.b { background: var(--busB); }
  .kv div b { color: var(--ink); }
  .empty { padding: 48px 20px; }
  .welcome { max-width: 760px; margin: 0 auto; text-align: center; }
  .welcome h2 { font-size: 24px; margin: 18px 0 6px; letter-spacing: -.01em; }
  .welcome .lead { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .welcome .diagram { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 26px; flex-wrap: wrap; }
  .welcome .node { padding: 12px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 650; min-width: 150px; color: var(--ink); }
  .welcome .node small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .welcome .node.a { border-top: 4px solid var(--busA); } .welcome .node.b { border-top: 4px solid var(--busB); }
  .welcome .node.iso { border-top: 4px solid var(--iso); background: color-mix(in srgb, var(--iso) 7%, var(--panel)); }
  .hd-a { border-top: 4px solid var(--busA); } .hd-b { border-top: 4px solid var(--busB); }
  .hd-iso { border-color: var(--iso); border-top: 4px solid var(--iso); background: color-mix(in srgb, var(--iso) 7%, var(--panel)); }
  .welcome .arrow { color: var(--muted); font-size: 22px; }
  .welcome .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; margin: 0 0 24px; }
  @media (max-width: 720px) { .welcome .steps { grid-template-columns: 1fr; } }
  .welcome .step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: 13.5px; box-shadow: var(--shadow); }
  .welcome .step b { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .welcome .num { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; align-items: center; justify-content: center; }

  .welcome .actions button { padding: 9px 18px; font-size: 14.5px; }
  .welcome .hint { margin: 6px 0; }
  .welcome .newhere { font-size: 14.5px; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1><svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><rect x="1" y="3" width="7" height="14" rx="2" fill="var(--busA)"/><rect x="18" y="3" width="7" height="14" rx="2" fill="var(--busB)"/><path d="M13 4l5 6-5 6-5-6z" fill="var(--iso)"/></svg>CAN Isolator</h1>
  <span id="connPill" class="pill"><span class="dot"></span><span>Not connected</span></span>
  <span id="cfgPill" class="pill" hidden></span>
  <span id="fwInfo" class="muted" style="font-size:12.5px"></span>
  <span class="spacer"></span>
  <span class="seg" id="numFmt" title="Show IDs and data in hex or decimal. Typing 0x… always means hex."><button data-f="hex">Hex</button><button data-f="dec">Dec</button></span>
  <button id="btnConnect" class="primary">Connect</button>
</header>

<nav id="tabs">

<main id="main"></main>

<div class="actionbar" id="actionbar" hidden>
  <button id="btnSend" class="primary" title="Run these settings on the board now (RAM only - a power cycle goes back to the saved settings)">Send to board</button>
  <button id="btnSave" title="Store the settings in the board's flash so they survive power-off">Save to board</button>

    <summary>More…</summary>

      <button id="btnExport">Export settings to a file…</button>
      <button id="btnImport">Import settings from a file…</button>

      <button id="btnRevert">Board: go back to saved settings</button>

      <button id="btnFirmware">Update firmware…</button>
    </div>

</div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<dialog id="reviewDlg"></dialog>

<script>
'use strict';

// ===========================================================================
// Serial link
// ===========================================================================
const link = {
  port: null, reader: null, writer: null, readClosed: null,
  waiter: null, chain: Promise.resolve(), busy: 0, bg: 0,
};
const enc = new TextEncoder();

function onLine(line) {
  line = line.trim();
  if (!line.startsWith('{')) return;            // boot messages etc.
  let o;
  try { o = JSON.parse(line); } catch { return; }
  if (link.waiter) link.waiter(o);
}

async function readLoop() {
  let buf = '';
  try {
    while (true) {
      const { value, done } = await link.reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) { onLine(buf.slice(0, i)); buf = buf.slice(i + 1); }
      if (buf.length > 65536) buf = '';
    }
  } catch (e) { /* port lost */ }
  if (link.port) handleDisconnect('Connection lost');
}

async function sendRaw(text) { await link.writer.write(enc.encode(text)); }

// Wait for a reply line matching 'match'. Register BEFORE sending.
function expect(match, timeoutMs, what) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => { link.waiter = null; reject(new Error('No reply from the board to "' + what + '"')); }, timeoutMs);
    link.waiter = (o) => { const r = match(o); if (r) { clearTimeout(t); link.waiter = null; resolve(r === true ? o : r); } };
  });
}

// Runs fn exclusively (one conversation with the board at a time).
function locked(fn) {
  const p = link.chain.then(async () => { link.busy++; try { return await fn(); } finally { link.busy--; } });
  link.chain = p.catch(() => {});
  return p;
}

async function request(line, match, timeoutMs = 2500) {
  const name = line.split(' ')[0];
  const p = expect(match || ((o) => (o.t === 'ok' || o.t === 'err') && o.re === name), timeoutMs, name);
  await sendRaw(line + '\n');
  return p;
}

async function requestOk(line, timeoutMs) {
  const r = await request(line, null, timeoutMs);
  if (r.t === 'err') throw new Error(r.msg);
  return r;
}

const cmd = {
  hello: () => locked(() => request('hello', (o) => o.t === 'hello')),
  get:   () => locked(() => request('get', (o) => o.t === 'cfg' && o.which !== 'saved')),
  getSaved: () => locked(() => request('get saved', (o) => o.t === 'cfg' && o.which === 'saved', 4000)),
  ev:    () => locked(() => request('ev', (o) => o.t === 'ev')),
  stat:  () => locked(() => request('stat', (o) => o.t === 'stat')),
  sniff: () => locked(() => {
    const got = [];
    const p = expect((o) => { if (o.t === 'sniff') { got[o.b] = o; if (got[0] && got[1]) return got; } return false; }, 2500, 'sniff');
    return sendRaw('sniff\n').then(() => p);
  }),
  simple: (line, timeoutMs) => locked(() => requestOk(line, timeoutMs)),
};

async function connect() {
  if (!('serial' in navigator)) {
    toast('This browser can’t use USB serial ports. Open this page in Google Chrome or Microsoft Edge (Safari and Firefox don’t support it). Double-click “Open Config Tool.command” (Mac) or “Open Config Tool.bat” (Windows) to open it in Chrome or Edge.', true);
    return;
  }
  let port;
  try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] }); }
  catch (e) {
    if (e && e.name === 'NotFoundError') return;      // chooser closed without picking a port
    toast('Couldn’t open the port chooser: ' + (e && e.message ? e.message : e), true);
    return;
  }
  await openPort(port, false, false);
}

// Open a port the user has granted. quiet: no toasts (auto-reconnect).
// keepEdits: keep unsent edits in the page (only refresh the board's copy).
async function openPort(port, quiet, keepEdits) {
  try { await port.open({ baudRate: 115200 }); }
  catch (e) {
    if (!quiet) toast('Could not open the port: ' + e.message + '. Is another program (serial monitor, PlatformIO, Arduino IDE) using it?', true);
    return false;
  }
  link.port = port;
  const dec = new TextDecoderStream();
  link.readClosed = port.readable.pipeTo(dec.writable).catch(() => {});
  link.reader = dec.readable.getReader();
  link.writer = port.writable.getWriter();
  link.chain = Promise.resolve();
  readLoop();
  try {
    await new Promise(r => setTimeout(r, 150));
    await sendRaw('\n');                              // flush any half line
    const h = await cmd.hello();
    if (h.proto !== 1) toast('This board speaks protocol ' + h.proto + '; this page expects 1. Some things may not work.', true);
    state.hello = h;
    state.loadHist = []; state.events = null; state.evN = -1; state.stat = null;
    if (keepEdits && state.edit && state.editDirty) state.board = await cmd.get();
    else await reloadFromBoard();
    state.connected = true;
    startPolling();
    if (!quiet) toast('Connected to ' + h.fw + ' ' + h.ver);
  } catch (e) {
    if (!quiet) toast(e.message + '. Is this a CAN isolator running firmware 2.0 or newer?', true);
    await disconnect();
    render();
    return false;
  }
  render();
  return true;
}

async function disconnect() {
  stopPolling();
  if (state.rp.running) { clearInterval(state.rp.timer); state.rp.running = false; }
  if (state.rec.on) recStop();
  if (state.chg.timer) { clearInterval(state.chg.timer); state.chg.timer = null; state.chg.phase = state.chg.base.size ? 'ready' : 'idle'; }
  const port = link.port;
  link.port = null;
  state.connected = false;
  try { await link.reader?.cancel(); } catch {}
  try { await link.readClosed; } catch {}
  try { link.writer?.releaseLock(); } catch {}
  try { await port?.close(); } catch {}
  link.reader = link.writer = null;
  render();
}

function handleDisconnect(msg) {
  if (!link.port) return;
  toast(msg, true);
  disconnect();
}

if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', (e) => { if (e.target === link.port) handleDisconnect('Board unplugged'); });
}

// ===========================================================================
// State
// ===========================================================================
const state = {
  connected: false,
  hello: null,
  board: null,        // last 'cfg' from the board
  edit: null,         // working copy (page model)
  editDirty: false,
  stat: null, statPrev: null, rates: null,
  sniffOn: false, sniff: [new Map(), new Map()], sniffLost: [0, 0],
  tab: 'status',
  // frame monitor
  monFilters: [], monOn: false, monFrames: [], monLost: 0, monPaused: false, monT0: null, monSel: null,
  // test frames
  sendForm: { bus: 0, id: 0x123, ext: 0, len: 8, data: [0, 0, 0, 0, 0, 0, 0, 0], period: 100 },
  txpSlots: [null, null, null, null],
  // status history (firmware 2.6+)
  loadHist: [], events: null, evN: -1,
  // "What changed?" in the sniffer
  chg: { phase: 'idle', buses: 3, baseSecs: 10, t0: 0, base: new Map(), cur: null, tries: [], timer: null },
  // record & replay
  rec: { on: false, frames: [], lost: 0, wall0: 0, what: 3, useMon: false },
  rp: { file: null, map: {}, speed: 1, loop: false, from: '', to: '', ids: '', idMode: 'only', running: false, status: null, timer: null },
  graph: { sigs: [], window: 60, source: 'live' },
};
const MON_KEEP = 100000;          // frames kept in the page for the log and the analyzer
const WHERE = { 1: 'A RX', 2: 'B RX', 4: 'A TX', 8: 'B TX' };

const DIR_LABEL = { 1: 'A → B', 2: 'B → A', 3: 'Both' };
const XF_LABEL = { none: '—', mergeButtons: 'Merge wheel buttons' };
const STATE_NAME = ['Active', 'Warning', 'Error passive', 'Bus-off'];
const BUS_NAME = ['Bus A · chassis side', 'Bus B · standalone ECU'];

// board 'cfg' JSON -> page model
function fromBoard(c) {
  return {
    baud: [...c.baud], swap: c.swap, def: [...c.def], txMaxAge: c.txMaxAge, btnStale: c.btnStale,
    btnId: c.btnId, btnExt: c.btnExt, hwFilterA: c.hwFilterA ?? 1,
    xforms: (c.xforms || []).map(x => ({ name: x.name, ops: x.ops.map(([kind, srcBus, srcId, srcExt, srcStart, srcLen, srcOrder, srcSigned, dstStart, dstLen, dstOrder, dstSigned, value, factor, offset, staleMs, cmp, step, flags]) =>
      ({ kind, srcBus, srcId, srcExt, srcStart, srcLen, srcOrder, srcSigned, dstStart, dstLen, dstOrder, dstSigned, value, factor, offset, staleMs, cmp, step, flags })) })),
    gens: (c.gens || []).map(g => ({ name: g.name, id: g.id, ext: g.ext, bus: g.bus, period: g.period, len: g.len, on: g.on,
      base: (g.base.match(/../g) || []).map(x => parseInt(x, 16)),
      sig: g.sig.map(([kind, srcBus, srcId, srcExt, srcStart, srcLen, srcOrder, srcSigned, dstStart, dstLen, dstOrder, dstSigned, factor, offset, staleMs, step]) =>
        ({ kind, srcBus, srcId, srcExt, srcStart, srcLen, srcOrder, srcSigned, dstStart, dstLen, dstOrder, dstSigned, factor, offset, staleMs, step })) })),
    btn: c.btn.map(([src, dst, mask, taps]) => ({ src, dst, mask, taps })),
    routes: c.routes.map(([first, last, ext, dir, action, xf, minMs, onChange, hbMs, note]) =>
      ({ first, last, ext, dir, action, xf, minMs, onChange, hbMs, note })),
  };
}

// page model -> upload lines
function toLines(m) {
  const L = [
    `set baudA ${m.baud[0]}`, `set baudB ${m.baud[1]}`, `set swap ${m.swap}`,
    `set defAB ${m.def[0]}`, `set defBA ${m.def[1]}`, `set txMaxAge ${m.txMaxAge}`,
    `set btnStale ${m.btnStale}`, `set btnId ${m.btnId}`, `set btnExt ${m.btnExt}`, `set hwFilterA ${m.hwFilterA ?? 1}`,
  ];
  for (const r of m.routes)
    L.push(`route ${r.first} ${r.last} ${r.ext} ${r.dir} ${r.action} ${r.xf} ${r.minMs} ${r.onChange ? 1 : 0} ${r.hbMs} ${cleanNote(r.note)}`);
  for (const b of m.btn) L.push(`btn ${b.src} ${b.dst} ${b.mask} ${b.taps ? 1 : 0}`);
  for (const x of m.xforms || []) {
    L.push(`xf ${cleanNote(x.name)}`);
    for (const o of x.ops)
      L.push(`xop ${o.kind} ${o.srcBus} ${o.srcId} ${o.srcExt} ${o.srcStart} ${o.srcLen} ${o.srcOrder} ${o.srcSigned ? 1 : 0} ` +
             `${o.dstStart} ${o.dstLen} ${o.dstOrder} ${o.dstSigned ? 1 : 0} ${o.value} ${o.factor} ${o.offset} ${o.staleMs} ${o.cmp} ${o.step} ${o.flags}`);
  }
  for (const g of m.gens) {
    const base = [...g.base, 0, 0, 0, 0, 0, 0, 0, 0].slice(0, 8).map((v, i) => (i < g.len ? v : 0).toString(16).padStart(2, '0')).join('');
    L.push(`gen ${g.period} ${g.id} ${g.ext} ${g.bus} ${g.len} ${g.on ? 1 : 0} ${base} ${cleanNote(g.name)}`);
    for (const f of g.sig)
      L.push(`gsig ${f.kind} ${f.srcBus} ${f.srcId} ${f.srcExt} ${f.srcStart} ${f.srcLen} ${f.srcOrder} ${f.srcSigned ? 1 : 0} ` +
             `${f.dstStart} ${f.dstLen} ${f.dstOrder} ${f.dstSigned ? 1 : 0} ${f.factor} ${f.offset} ${f.staleMs} ${f.step}`);
  }
  return L;
}

function cleanNote(s) {
  const max = state.hello?.noteLen ?? 23;
  return String(s || '').replace(/[^\x20-\x7e]|["\\]/g, '').slice(0, max).trim();
}

async function reloadFromBoard() {
  const c = await cmd.get();
  state.board = c;
  state.edit = fromBoard(c);
  state.editDirty = false;
}

// ===========================================================================
// Board actions
// ===========================================================================
async function uploadEdit() {
  const errs = modelErrors(state.edit);
  if (errs.length) throw new Error('Fix these first: ' + errs.slice(0, 3).join('; '));
  return locked(async () => {
    await requestOk('begin');
    let batch = '';
    for (const l of toLines(state.edit)) {
      batch += l + '\n';
      if (batch.length > 1200) { await sendRaw(batch); batch = ''; await requestOk('ping'); }
    }
    if (batch) await sendRaw(batch);
    return requestOk('commit', 4000);
  });
}

async function doAction(label, fn) {
  setActionMsg(label + '…');
  try { await fn(); }
  catch (e) { toast(e.message, true); }
  setActionMsg('');
  render();
}

async function actSend(reviewed) {
  if (reviewed !== true && !(await reviewForSend(false))) return;
  await doAction('Sending', async () => {
    const r = await uploadEdit();
    await reloadFromBoard();
    toast(r.restart ? 'Running now. Bit rate / connector changes need Save + restart.' : 'Running on the board now (not saved yet).');
  });
}

async function actSave() {
  if (!(await reviewForSave())) return;
  await doAction('Saving', async () => {
    if (state.editDirty) await uploadEdit();
    const r = await cmd.simple('save', 5000);
    await reloadFromBoard();
    toast(r.restart ? 'Saved. Restart the board to apply the bit rate / connector change.' : 'Saved to the board.');
  });
}

async function actDiscard() {
  await doAction('Reloading', async () => { await reloadFromBoard(); toast('Edits discarded.'); });
}

async function actBoard(line, msg, confirmText) {
  closeMenu();
  if (confirmText && !confirm(confirmText)) return;
  await doAction('Working', async () => {
    if (line === 'reboot') {
      const ok = await restartAndReconnect();
      toast(ok ? 'Restarted and reconnected.' : 'Restarted. Reconnect when the board is back.', !ok);
      return;
    }
    await cmd.simple(line, 5000);
    await reloadFromBoard();
    toast(msg);
  });
}

// ===========================================================================
// Polling (status + sniffer)
// ===========================================================================
let pollTimer = null;
let monTimer = null;
function startPolling() { stopPolling(); pollTimer = setInterval(poll, 1000); monTimer = setInterval(pollMon, 250); poll(); }
function stopPolling() { if (pollTimer) clearInterval(pollTimer); if (monTimer) clearInterval(monTimer); pollTimer = monTimer = null; }

let monPolling = false;
async function pollMon() {
  if (!state.connected || !state.monOn || monPolling) return;
  monPolling = true;
  try {
    let got = 0;
    const max = state.rec.on ? 40 : 8;                // recording: empty the board's buffer faster
    for (let i = 0; i < max; i++) {                    // empty the board's buffer
      const d = await lockedBg(() => request('mon', (o) => o.t === 'mon'));
      state.monLost += d.lost;
      const batch = [];
      for (const [t, where, id, ext, data] of d.f) {
        if (state.monT0 === null) state.monT0 = t;
        batch.push({ t: ((t - state.monT0) >>> 0) / 10000, where, id, ext, data });
      }
      for (const f of batch) state.monFrames.push(f);
      recPush(batch, d.lost);
      got += d.f.length;
      if (!d.on) { state.monOn = false; recStop('The board stopped the monitor (no requests for 5 s), so recording stopped.'); toast('The board stopped the monitor (no requests for 5 s).', true); renderTab(false); break; }
      if (!d.more) break;
    }
    if (state.monFrames.length > MON_KEEP * 1.1) state.monFrames.splice(0, state.monFrames.length - MON_KEEP);
    if (got && !state.monPaused && (state.tab === 'monitor' || state.tab === 'graph' || state.tab === 'replay')) renderTab(true);
  } catch (e) { /* missed poll */ }
  monPolling = false;
}

let statPolling = false;
async function poll() {
  if (!state.connected || link.busy - link.bg > 0 || statPolling) return;
  statPolling = true;
  try {
    const s = await cmd.stat();
    loadUpdate(s, state.stat);
    if (state.stat) {
      const dt = (s.up - state.stat.up) / 1000;
      if (dt > 0) state.rates = { dt, bus: s.bus.map((b, i) => rateObj(b, state.stat.bus[i], dt)),
                                  gen: s.gen.map((g, i) => ({ sent: (g.sent - (state.stat.gen[i]?.sent ?? g.sent)) / dt, nosrc: (g.nosrc - (state.stat.gen[i]?.nosrc ?? g.nosrc)) / dt })) };
    }
    state.stat = s;
    await evUpdate(s);
    if (state.sniffOn && (state.tab === 'sniffer' || state.chg.phase === 'base' || state.chg.phase === 'act')) await sniffNow();
    if (state.tab === 'status' || state.tab === 'sniffer') renderTab(true);
    updateHeader();
  } catch (e) { /* a missed poll is fine */ }
  statPolling = false;
}

function rateObj(b, p, dt) {
  const o = {};
  for (const k of ['rx', 'fwd', 'filt', 'supp', 'tx']) o[k] = (b[k] - p[k]) / dt;
  return o;
}

// ===========================================================================
// Model checks (mirror the firmware's checks, plus advice)
// ===========================================================================
const maxId = (ext) => ext ? 0x1FFFFFFF : 0x7FF;

function routeIssues(m, i) {
  const r = m.routes[i], e = [], w = [];
  if (!Number.isFinite(r.first) || r.first < 0 || r.first > maxId(r.ext)) e.push(r.ext ? 'ID must be ≤ 1FFFFFFF' : 'ID must be ≤ 7FF (or tick 29-bit)');
  if (r.last && (r.last < r.first || r.last > maxId(r.ext))) e.push('range end must be ≥ ID and valid');
  if (!Number.isFinite(r.minMs) || r.minMs < 0 || r.minMs > 65535) e.push('min interval 0-65535');
  if (!Number.isFinite(r.hbMs) || r.hbMs < 0 || r.hbMs > 65535) e.push('heartbeat 0-65535');
  const range = r.last && r.last !== r.first;
  if (range && (r.minMs || r.onChange)) w.push('rate limit / on-change are ignored on ranges');
  if (r.hbMs && !r.onChange) w.push('heartbeat does nothing without on-change');
  if (r.xf >= (state.hello?.xfCustom ?? 2) + (m.xforms || []).length) e.push('unknown transform');
  if (r.action === 1 && (r.xf || r.minMs || r.onChange)) w.push('DROP row: other options unused');
  if (state.hello && state.hello.xf[r.xf] === 'mergeButtons' && m.btn.length === 0) w.push('button map is empty');
  // Shadowed by an earlier row?
  if (e.length === 0) {
    const lo = r.first, hi = r.last || r.first;
    for (let j = 0; j < i; j++) {
      const q = m.routes[j];
      if (q.ext !== r.ext) continue;
      if ((q.dir & r.dir) !== r.dir) continue;
      if (q.first <= lo && (q.last || q.first) >= hi) { w.push(`never used: row ${j + 1} matches first`); break; }
    }
  }
  return { e, w };
}

function modelErrors(m) {
  const out = [];
  m.routes.forEach((r, i) => routeIssues(m, i).e.forEach(x => out.push(`route ${i + 1}: ${x}`)));
  if (state.hello && m.routes.length > state.hello.maxRoutes) out.push(`too many routes (max ${state.hello.maxRoutes})`);
  if (!(m.btnId >= 0 && m.btnId <= maxId(m.btnExt))) out.push('buttons ID invalid');
  if (!(m.txMaxAge >= 5 && m.txMaxAge <= 1000)) out.push('TX max age must be 5-1000 ms');
  if (!(m.btnStale >= 10 && m.btnStale <= 5000)) out.push('button timeout must be 10-5000 ms');
  (m.gens || []).forEach((g, i) => genIssues(m, i).e.forEach(x => out.push(`generated frame ${i + 1}: ${x}`)));
  (m.xforms || []).forEach((x, i) => xfIssues(m, i).e.forEach(z => out.push(`transform ${i + 1}: ${z}`)));
  m.btn.forEach((b, i) => { if (!(b.src >= 0 && b.src <= 7 && b.dst >= 0 && b.dst <= 7 && b.mask >= 0 && b.mask <= 255)) out.push(`button row ${i + 1} invalid`); });
  return out;
}

// What would happen to a frame (mirrors handleFrame)
function routeVerdict(m, bus, id, ext) {
  {
    const g = (m.gens || []).find(g => g.id === id && g.ext === ext && g.bus !== bus);
    if (g && g.on) return { text: 'Dropped (isolator generates it)', cls: 'warn', row: -2 };
  }
  const bit = bus === 0 ? 1 : 2;
  for (let i = 0; i < m.routes.length; i++) {
    const r = m.routes[i];
    if (!(r.dir & bit) || r.ext !== ext) continue;
    if (id >= r.first && id <= (r.last || r.first))
      return r.action === 1 ? { text: `Row ${i + 1}: drop`, cls: 'bad', row: i } : { text: `Row ${i + 1}: pass` + (r.xf ? ' + transform' : ''), cls: 'ok', row: i };
  }
  return m.def[bus] ? { text: 'Default: pass', cls: '', row: -1 } : { text: 'Default: drop', cls: 'bad', row: -1 };
}

// ===========================================================================
// Rendering helpers
// ===========================================================================
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const hex = (n, ext) => !Number.isFinite(n) ? '' : ext ? n.toString(16).toUpperCase().padStart(8, '0') : n.toString(16).toUpperCase().padStart(3, '0');
const fmtRate = (v) => v === undefined ? '–' : v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(1);

function updateHeader() {
  if (!('serial' in navigator)) {
    const b = $('#btnConnect');
    b.textContent = 'Needs Chrome or Edge';
    b.title = 'Safari and Firefox can’t talk to USB serial devices. Open this page in Chrome or Edge.';
  }
  const cp = $('#connPill');
  cp.className = 'pill ' + (state.connected ? 'ok' : '');
  cp.lastElementChild.textContent = state.connected ? 'Connected' : 'Not connected';
  $('#btnConnect').textContent = state.connected ? 'Disconnect' : 'Connect';
  $('#fwInfo').textContent = state.hello && state.connected ? `${state.hello.fw} ${state.hello.ver} · last reset: ${state.hello.reset}` : '';

  const pill = $('#cfgPill');
  const b = state.board;
  if (state.connected && b) {
    pill.hidden = false;
    if (b.restart) { pill.className = 'pill warn'; pill.textContent = 'Restart needed for bit rate / connector change'; }
    else if (b.dirty) { pill.className = 'pill warn'; pill.textContent = 'Board is running unsaved settings (lost at power-off)'; }
    else if (b.src.startsWith('defaults (')) { pill.className = 'pill bad'; pill.textContent = 'Saved settings were invalid: running defaults'; }
    else { pill.className = 'pill ok'; pill.textContent = b.saved ? 'Board running its saved settings' : 'Board running factory defaults'; }
  } else pill.hidden = true;

  $('#actionbar').hidden = !state.edit;
  const c = state.connected;
  $('#btnSend').disabled = !c || !state.editDirty;
  $('#btnSave').disabled = !c || (!state.editDirty && !(b && b.dirty));
  $('#btnDiscard').disabled = !c || !state.editDirty;
  $('#btnReview').disabled = !c || !state.editDirty;
  for (const id of ['btnRevert', 'btnDefaults', 'btnErase', 'btnReboot']) $('#' + id).disabled = !c;
  $('#actionMsg').textContent = busyLabel || (state.editDirty ? 'You have edits that are not on the board yet.' : '');
}

function render() {
  syncNavTop();

  updateHeader(); renderTab(false);
}

function renderTab(live) {
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('active', b.dataset.tab === state.tab);
  const main = $('#main');
  if (state.tab === 'help') { if (!live) main.replaceChildren(helpView()); return; }   // help works offline / unsupported browsers too
  if (!('serial' in navigator)) { main.replaceChildren(unsupportedView()); return; }
  if (!state.edit) { if (!live) main.replaceChildren(emptyView()); return; }
  if (live) {
    // Live refresh: only redraw the parts that show board data, keep inputs intact.
    if (state.tab === 'status' && !chartHover) main.replaceChildren(statusView());
    if (state.tab === 'graph' && !chartHover) { const w = $('#graphCharts'); if (w) w.replaceWith(graphCharts()); }
    if (state.tab === 'replay') rpRefresh();
    if (state.tab === 'sniffer') { const w = $('#sniffBody'); if (w) w.replaceWith(sniffBody()); }
    if (state.tab === 'monitor' && !state.monPaused) monRefresh();
    if (state.tab === 'send') { const w = $('#txpSlots'); if (w) w.replaceWith(txpSlotsView()); }
    if (state.tab === 'generated') state.edit.gens.forEach((g, gi) => {     // live data, unless typing there
      const el = $('#gen-side-' + gi);
      if (el && !el.contains(document.activeElement)) refreshGen(gi);
    });
    return;
  }
  const views = { status: statusView, routes: routesView, transforms: transformsView, buttons: buttonsView, settings: settingsView, generated: generatedView, sniffer: snifferView, monitor: monitorView, send: sendView, dbc: dbcView, firmware: firmwareView, help: helpView, replay: replayView, graph: graphView };
  main.replaceChildren(views[state.tab]());
}

function addRoute(r) {
  const m = state.edit;

  if (state.tab === 'routes') { renderTab(false); window.scrollTo(0, document.body.scrollHeight); }

    await requestOk('mon clear');

// ===========================================================================
// Bit analyzer
// ===========================================================================
// Bit numbering follows DBC files: position = byte * 8 + bit, bit 0 = least
// significant bit of the byte. Intel (little-endian) signals start at their
// least significant bit and count up; Motorola (big-endian) signals start at
// their most significant bit and continue into the NEXT byte's bit 7.
const sigStore = (() => { try { return JSON.parse(localStorage.getItem('isolator-signals') || '{}'); } catch { return {}; } })();
function saveSigStore() { localStorage.setItem('isolator-signals', JSON.stringify(sigStore)); }
const sigKey = (sel) => `${sel.ext}:${sel.id}`;
let curSig = { name: '', order: 'motorola', start: 7, len: 8, signed: 0, factor: 1, offset: 0, unit: '' };
let bitAnchor = null;
let chartHover = false;

// Bit positions of a signal, most significant first; null if it doesn't fit in 8 bytes.
function sigPositions(sig) {
  const out = [];
  if (!(sig.len >= 1 && sig.len <= 64 && sig.start >= 0 && sig.start <= 63)) return null;
  if (sig.order === 'intel') {
    for (let i = sig.len - 1; i >= 0; i--) out.push(sig.start + i);
  } else {
    let p = sig.start;
    for (let i = 0; i < sig.len; i++) { out.push(p); p = p % 8 === 0 ? p + 15 : p - 1; }
  }
  return out.every(p => p >= 0 && p <= 63) ? out : null;
}
const motSeq = (p) => Math.floor(p / 8) * 8 + (7 - p % 8);

function decode(bytes, sig, pos) {
  if (!pos || pos.some(p => (p >> 3) >= bytes.length)) return null;
  let raw = 0n;
  for (const p of pos) raw = (raw << 1n) | BigInt((bytes[p >> 3] >> (p & 7)) & 1);
  if (sig.signed && sig.len > 1 && (raw >> BigInt(sig.len - 1)) & 1n) raw -= 1n << BigInt(sig.len);
  return { raw, value: Number(raw) * sig.factor + sig.offset };
}

function dbcLine(sig) {
  const name = (sig.name || 'Signal').replace(/[^A-Za-z0-9_]/g, '_');
  return `SG_ ${name} : ${sig.start}|${sig.len}@${sig.order === 'intel' ? 1 : 0}${sig.signed ? '-' : '+'} (${sig.factor},${sig.offset}) [0|0] "${sig.unit || ''}" Vector__XXX`;
}

function parseDbcLine(text) {
  const m = /SG_\s+(\w+)\s*(?:\w+\s*)?:\s*(\d+)\|(\d+)@([01])([+-])\s*\(\s*([-+\d.eE]+)\s*,\s*([-+\d.eE]+)\s*\)(?:\s*\[[^\]]*\])?\s*(?:"([^"]*)")?/.exec(text);
  if (!m) return null;
  return { name: m[1], start: +m[2], len: +m[3], order: m[4] === '1' ? 'intel' : 'motorola', signed: m[5] === '-' ? 1 : 0, factor: +m[6], offset: +m[7], unit: m[8] || '' };
}

function bitClick(pos) {
  if (bitAnchor === null) {
    bitAnchor = pos;
    curSig.start = pos; curSig.len = 1;
  } else {
    const a = bitAnchor, b = pos;
    if (curSig.order === 'intel') { curSig.start = Math.min(a, b); curSig.len = Math.abs(a - b) + 1; }
    else { curSig.start = motSeq(a) <= motSeq(b) ? a : b; curSig.len = Math.abs(motSeq(a) - motSeq(b)) + 1; }
    bitAnchor = null;
  }
  renderTab(false);
}

function selFrames() {
  const s = state.monSel;
  return state.monFrames.filter(f => f.where === s.where && f.id === s.id && f.ext === s.ext);
}

function analyzerForm() {

// Changing bytes (8- and 16-bit candidates) and rolling counters.
function suggestions(all, toggles, maxLen) {
  const out = [];
  const changes = (by) => toggles.slice(by * 8, by * 8 + 8).some(x => x > 0);
  const counterStep = (vals, mod) => {
    if (vals.length < 8) return 0;
    const d = (vals[1] - vals[0] + mod) % mod;
    if (!d || d > 4) return 0;
    for (let i = 2; i < vals.length; i++) if ((vals[i] - vals[i - 1] + mod) % mod !== d) return 0;
    return d;
  };
  const tail = all.slice(-200);
  for (let by = 0; by < maxLen; by++) {
    if (!changes(by)) continue;
    const vals = tail.map(b => b[by] ?? 0);
    const c8 = counterStep(vals, 256), lo = counterStep(vals.map(v => v & 15), 16), hi = counterStep(vals.map(v => v >> 4), 16);
    if (c8) out.push({ label: `Counter: byte ${by}`, title: `Steps by ${c8} every frame`, sig: { order: 'intel', start: by * 8, len: 8, signed: 0, factor: 1, offset: 0 } });
    else if (lo) out.push({ label: `Counter: byte ${by} low nibble`, title: `Steps by ${lo} every frame`, sig: { order: 'intel', start: by * 8, len: 4, signed: 0, factor: 1, offset: 0 } });
    else if (hi) out.push({ label: `Counter: byte ${by} high nibble`, title: `Steps by ${hi} every frame`, sig: { order: 'intel', start: by * 8 + 4, len: 4, signed: 0, factor: 1, offset: 0 } });
    else out.push({ label: `Byte ${by}`, title: '8-bit value', sig: { order: 'intel', start: by * 8, len: 8, signed: 0, factor: 1, offset: 0 } });
    if (by + 1 < maxLen && changes(by + 1)) {
      {
        out.push({ label: `Bytes ${by}–${by + 1} big-endian`, title: '16-bit, Motorola: byte ' + by + ' is the high byte', sig: { order: 'motorola', start: by * 8 + 7, len: 16, signed: 0, factor: 1, offset: 0 } });
        out.push({ label: `Bytes ${by}–${by + 1} little-endian`, title: '16-bit, Intel: byte ' + by + ' is the low byte', sig: { order: 'intel', start: by * 8, len: 16, signed: 0, factor: 1, offset: 0 } });
      }
    }
  }
  // de-duplicate by label, keep it short
  const seen = new Set();
  return out.filter(s => !seen.has(s.label) && seen.add(s.label)).slice(0, 14);
}

// Single-series line chart, value over capture time, with a hover crosshair.
function lineChart(pts, title, fmtV) {
  const W = 640, H = 190, L = 56, R = 12, T = 12, B = 26;
  let p = pts;
  if (p.length > 1500) { const k = Math.ceil(p.length / 1500); p = p.filter((_, i) => i % k === 0 || i === pts.length - 1); }
  const t0 = p[0].t, t1 = p[p.length - 1].t || t0 + 1;
  let lo = Math.min(...p.map(x => x.v)), hi = Math.max(...p.map(x => x.v));
  if (lo === hi) { lo -= 1; hi += 1; }
  // round axis ticks: 1, 2 or 5 x 10^n
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(k => k * mag).find(x => x >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  const X = (t) => L + (t - t0) / ((t1 - t0) || 1) * (W - L - R);
  const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, a, txt) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt !== undefined) e.textContent = txt; return e; };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': `${title} over time` });
  for (const v of ticks) {
    const y = Y(v);
    svg.append(el('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'grid' }));
    svg.append(el('text', { x: L - 6, y: y + 4, 'text-anchor': 'end', class: 'axis' }, fmtV(Math.round(v / step) * step)));
  }
  svg.append(el('text', { x: L, y: H - 6, class: 'axis' }, t0.toFixed(2) + ' s'));
  svg.append(el('text', { x: W - R, y: H - 6, 'text-anchor': 'end', class: 'axis' }, t1.toFixed(2) + ' s'));
  svg.append(el('path', { d: p.map((q, i) => (i ? 'L' : 'M') + X(q.t).toFixed(1) + ' ' + Y(q.v).toFixed(1)).join(''), class: 'series' }));
  const cross = el('line', { y1: T, y2: H - B, class: 'cross', visibility: 'hidden' });
  const dot = el('circle', { r: 4, class: 'dot', visibility: 'hidden' });
  svg.append(cross, dot);
  const tip = h('div', { class: 'tip', hidden: true });
  const hit = el('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' });
  svg.append(hit);
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * W;
    const t = t0 + (x - L) / (W - L - R) * (t1 - t0);
    let best = p[0];
    for (const q of p) if (Math.abs(q.t - t) < Math.abs(best.t - t)) best = q;
    const cx = X(best.t), cy = Y(best.v);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
    tip.hidden = false;
    tip.textContent = `${best.t.toFixed(3)} s · ${fmtV(best.v)}`;
    tip.style.left = Math.min(r.width - 140, Math.max(0, cx / W * r.width + 10)) + 'px';
    tip.style.top = (cy / H * r.height - 30) + 'px';
  };
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseenter', () => { chartHover = true; });
  hit.addEventListener('mouseleave', () => { chartHover = false; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; });
  return h('div', { class: 'chart-wrap' }, h('div', { class: 'chart-title' }, title), svg, tip);
}

// Test frame sender tab
// ===========================================================================
let sendWarned = false;
function confirmSend() {
  if (sendWarned) return true;
  sendWarned = confirm('Test frames go onto the real CAN bus. On the car they can trigger warnings, change what the ECU or cluster does, or clash with a real node using the same ID. Continue?');
  return sendWarned;
}

function sendHex(f) { return f.data.slice(0, f.len).map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase(); }
function sendErrors(f) {
  const e = [];
  if (!(f.id >= 0 && f.id <= maxId(f.ext))) e.push(f.ext ? 'ID must be ≤ 1FFFFFFF' : 'ID must be ≤ 7FF (or tick 29-bit)');
  if (f.data.slice(0, f.len).some(v => !(v >= 0 && v <= 255))) e.push('each byte must be 0-255');
  return e;
}

async function sendOnce() {
  const f = state.sendForm, e = sendErrors(f);
  if (e.length) { toast(e.join('; '), true); return; }
  if (!confirmSend()) return;
  try { await cmd.simple(`tx ${f.bus} ${f.id} ${f.ext} ${sendHex(f)}`); toast(`Sent ${fmtId(f.id, f.ext)} on Bus ${f.bus ? 'B' : 'A'}.`); }
  catch (err) { toast(err.message, true); }
}

async function startRepeat() {
  const f = state.sendForm, e = sendErrors(f);
  if (!(f.period >= 1 && f.period <= 60000)) e.push('period must be 1-60000 ms');
  if (e.length) { toast(e.join('; '), true); return; }
  const on = state.stat?.txp ?? [];
  let slot = state.txpSlots.findIndex((s, i) => !(on[i] && on[i][0]));
  if (slot < 0) { toast('All 4 repeat slots are busy. Stop one first.', true); return; }
  if (!confirmSend()) return;
  try {
    await cmd.simple(`txp ${slot} ${f.bus} ${f.period} ${f.id} ${f.ext} ${sendHex(f)}`);
    state.txpSlots[slot] = { ...f, data: [...f.data] };
    if (state.stat) { state.stat.txp = state.stat.txp || [[0, 0], [0, 0], [0, 0], [0, 0]]; state.stat.txp[slot] = [1, 0]; }
    toast(`Repeating ${fmtId(f.id, f.ext)} every ${f.period} ms (slot ${slot + 1}).`);
  } catch (err) { toast(err.message, true); }
  renderTab(false);
}

async function stopRepeat(slot) {
  try { await cmd.simple(slot === 'all' ? 'txp off' : `txp ${slot} off`); } catch (err) { toast(err.message, true); }
  if (state.stat?.txp) state.stat.txp.forEach((x, i) => { if (slot === 'all' || i === slot) x[0] = 0; });
  renderTab(false);
}

    t ? h('p', { class: 'hint', style: 'margin:10px 0 0' }, `Test frames queued since the board started: Bus A ${t[0].toLocaleString()}, Bus B ${t[1].toLocaleString()}.`) : null);

// ===========================================================================
// Generated frames: engine (same math as GenEngine.h, float32 via Math.fround)
// ===========================================================================
const GS_SOURCE = 1, GS_COUNTER = 2, BO_MOT = 0, BO_INTEL = 1;
const genNext = (pos, order) => order === BO_INTEL ? pos + 1 : (pos % 8 === 0 ? pos + 15 : pos - 1);

function genPositions(start, len, order) {           // in field order (Intel: LSB first, Motorola: MSB first)
  const out = []; let p = start;
  for (let i = 0; i < len; i++) { out.push(p); p = genNext(p, order); }
  return out;
}
function genFits(start, len, order, bytes) {
  if (!(len >= 1 && len <= 32 && start >= 0 && start <= 63)) return false;
  return genPositions(start, len, order).every(p => p >= 0 && p < bytes * 8);
}
function genGetJs(b, start, len, order) {
  let v = 0;
  const pos = genPositions(start, len, order);
  if (order === BO_INTEL) pos.forEach((p, i) => { v += ((b[p >> 3] >> (p & 7)) & 1) * 2 ** i; });
  else pos.forEach(p => { v = v * 2 + ((b[p >> 3] >> (p & 7)) & 1); });
  return v;
}
function genPutJs(b, start, len, order, v) {
  const pos = genPositions(start, len, order);
  const bits = []; for (let i = 0; i < len; i++) bits.push(Math.floor(v / 2 ** i) % 2);   // LSB first
  pos.forEach((p, i) => {
    const bit = order === BO_INTEL ? bits[i] : bits[len - 1 - i];
    if (bit) b[p >> 3] |= 1 << (p & 7); else b[p >> 3] &= ~(1 << (p & 7));
  });
}
// Returns the destination field's value (as a signed number when dstSigned) after scale/round/clamp.
function genScaleJs(raw, s) {
  const f = Math.fround;
  let x = raw;
  if (s.srcSigned && raw >= 2 ** (s.srcLen - 1)) x = raw - 2 ** s.srcLen;
  x = f(x);
  let v = f(f(x * f(s.factor)) + f(s.offset));
  const lo = s.dstSigned ? -(2 ** (s.dstLen - 1)) : 0, hi = s.dstSigned ? 2 ** (s.dstLen - 1) - 1 : 2 ** s.dstLen - 1;
  if (Number.isNaN(v)) v = 0;
  if (v <= lo) return lo;
  if (v >= hi) return hi;
  let r = v > 0 ? Math.trunc(f(v + 0.5)) : Math.floor(f(v + 0.5));
  return Math.min(hi, Math.max(lo, r));
}
const toField = (v, len) => v < 0 ? v + 2 ** len : v;     // two's complement for writing

// Build a frame from test source values (raw source field values) and counter values.
function genPreview(g, srcRaw, ctr) {
  const out = [...g.base];
  g.sig.forEach((s, i) => {
    if (!genFits(s.dstStart, s.dstLen, s.dstOrder, g.len)) return;
    if (s.kind === GS_SOURCE) genPutJs(out, s.dstStart, s.dstLen, s.dstOrder, toField(genScaleJs(srcRaw[i] ?? 0, s), s.dstLen));
    else genPutJs(out, s.dstStart, s.dstLen, s.dstOrder, (ctr[i] ?? 0) % 2 ** s.dstLen);
  });
  return out.slice(0, g.len);
}

function newField(kind) {
  return { kind, srcBus: 1, srcId: 0x640, srcExt: 0, srcStart: 7, srcLen: 16, srcOrder: BO_MOT, srcSigned: 0,
           dstStart: 7, dstLen: 8, dstOrder: BO_MOT, dstSigned: 0, factor: 1, offset: 0, staleMs: 500, step: 1 };
}
function newGen() {
  return { name: 'New frame', id: 0x700, ext: 0, bus: 0, period: 100, len: 8, on: 0, base: [0, 0, 0, 0, 0, 0, 0, 0], sig: [] };
}

function genIssues(m, gi) {
  const g = m.gens[gi], e = [], w = [];
  if (!(g.id >= 0 && g.id <= maxId(g.ext))) e.push(g.ext ? 'ID must be ≤ 1FFFFFFF' : 'ID must be ≤ 7FF (or tick 29-bit)');
  if (!(g.period >= 1 && g.period <= 60000)) e.push('period must be 1-60000 ms');
  else if (g.period < 5) w.push('a period under 5 ms is a lot of bus load');
  if (g.base.slice(0, g.len).some(v => !(v >= 0 && v <= 255))) e.push('constant bytes must be 0-255');
  const used = new Map();
  g.sig.forEach((s, i) => {
    const n = `field ${i + 1}`;
    if (!genFits(s.dstStart, s.dstLen, s.dstOrder, g.len)) e.push(`${n}: its bits don’t fit in the ${g.len}-byte frame`);
    else genPositions(s.dstStart, s.dstLen, s.dstOrder).forEach(p => { if (used.has(p) && used.get(p) !== i) w.push(`${n} overlaps field ${used.get(p) + 1}`); used.set(p, i); });
    if (s.kind === GS_SOURCE) {
      if (!(s.srcId >= 0 && s.srcId <= maxId(s.srcExt))) e.push(`${n}: bad source ID`);
      if (!genFits(s.srcStart, s.srcLen, s.srcOrder, 8)) e.push(`${n}: source bits don’t fit in 8 bytes`);
      if (!Number.isFinite(s.factor) || !Number.isFinite(s.offset)) e.push(`${n}: factor / offset must be numbers`);
      if (!(s.staleMs >= 0 && s.staleMs <= 65535)) e.push(`${n}: stale time 0-65535 ms`);
      if (s.srcId === g.id && s.srcExt === g.ext && s.srcBus === g.bus) w.push(`${n}: reads its own frame`);
    } else if (!(s.step >= 0 && s.step <= 255)) e.push(`${n}: counter step 0-255`);
  });
  const dupe = m.gens.findIndex((o, j) => j !== gi && o.id === g.id && o.ext === g.ext && o.bus === g.bus);
  if (dupe >= 0) w.push(`same ID and bus as generated frame ${dupe + 1}`);
  if (!g.sig.some(s => s.kind === GS_SOURCE) && g.on) w.push('no source fields: this frame is sent all the time');
  return { e: [...new Set(e)], w: [...new Set(w)] };
}

// Factor / offset from engineering units: physical = raw × scale + offset on each side.
function unitsHelper(s, gi) {
  const sc = s._srcScale || { f: 1, o: 0 };
  const st = { a: sc.f, b: sc.o, c: 1, d: 0 };
  const inp = (k) => h('input', { class: 'num', value: st[k], oninput: (e) => { st[k] = Number(e.target.value); } });
  return h('details', { class: 'units' }, h('summary', {}, 'Work it out from units…'),
    h('div', { class: 'units-body' },
      h('div', {}, 'Source: physical = raw × ', inp('a'), ' + ', inp('b'), sc.unit ? ` (${sc.unit})` : ''),
      h('div', {}, 'This frame: physical = raw × ', inp('c'), ' + ', inp('d')),
      h('button', { class: 'small', onclick: () => {
        if (!(st.c !== 0 && [st.a, st.b, st.c, st.d].every(Number.isFinite))) { toast('Enter numbers; the destination scale can’t be 0.', true); return; }

        markDirty(); renderTab(false);
      } }, 'Set factor and offset')));

// Right side of a frame card: bit map, test preview, live data, problems.

  const { e, w } = genIssues(state.edit, gi);
  const owner = new Map();
  g.sig.forEach((s, fi) => { if (genFits(s.dstStart, s.dstLen, s.dstOrder, g.len)) genPositions(s.dstStart, s.dstLen, s.dstOrder).forEach(p => owner.set(p, fi)); });

        h('input', { class: 'id', value: isHex() ? (t.src[i] ?? 0).toString(16).toUpperCase() : (t.src[i] ?? 0), oninput: (ev) => {
          const v = parseId(ev.target.value); ev.target.classList.toggle('bad', !Number.isFinite(v)); t.src[i] = Number.isFinite(v) ? v : 0; refreshGen(gi); } }),
        ' → field value ', h('b', {}, String(genScaleJs(t.src[i] ?? 0, s))))
    : h('label', { style: 'display:block;margin-top:4px' }, `Field ${i + 1} counter `,

  const live = state.connected && sameOnBoard && st ? h('div', { style: 'margin-top:10px' },
    h('b', {}, 'On the board now'),
    h('div', { class: 'mono' }, st.ours ? fmtBytes(st.ours) : 'nothing sent yet'),
    h('div', { class: 'hint', style: 'margin:2px 0 0' }, `${st.sent.toLocaleString()} sent · ${st.nosrc.toLocaleString()} periods skipped for a missing source`)) : null;

  return h('div', { class: 'gen-side', id: 'gen-side-' + gi },
    h('b', {}, 'Bit map and preview'),
    h('p', { class: 'hint', style: 'margin:2px 0 6px' }, picking ? 'Click the first and last bit of the field.' : 'Numbers are field bits; the rest are the constant bits.'),

    h('div', { style: 'margin-top:8px' }, h('span', { class: 'muted' }, 'Frame with these test values: '), h('span', { class: 'mono gen-preview' }, fmtBytes(preview.map(v => v.toString(16).padStart(2, '0')).join('')))),

function refreshGen(gi) {
  const el = $('#gen-side-' + gi);
  if (el && state.edit.gens[gi]) el.replaceWith(genSide(state.edit.gens[gi], gi));
}

function genGridClick(gi, p) {
  if (!genPick || genPick.gi !== gi) return;
  const s = state.edit.gens[gi].sig[genPick.fi];
  if (genPick.anchor === null) { genPick.anchor = p; refreshGen(gi); return; }
  const a = genPick.anchor, b = p;
  if (s.dstOrder === BO_INTEL) { s.dstStart = Math.min(a, b); s.dstLen = Math.abs(a - b) + 1; }
  else { s.dstStart = motSeq(a) <= motSeq(b) ? a : b; s.dstLen = Math.abs(motSeq(a) - motSeq(b)) + 1; }
  genPick = null; markDirty(); renderTab(false);
}

// ===========================================================================
// DBC files
// ===========================================================================
// Kept in this browser (localStorage) as the original text and parsed on load.
// Each file applies to Bus A, Bus B or either; the first enabled file that
// defines an ID wins.
const dbcState = { files: [] };    // { name, bus: -1|0|1, on, text, db }

function parseDbc(text) {
  const msgs = new Map();
  const lines = text.split(/\r?\n/);
  let cur = null;
  for (const raw of lines) {
    const line = raw.trim();
    let m;
    if ((m = /^BO_\s+(\d+)\s+(\w+)\s*:\s*(\d+)\s*(\w*)/.exec(line))) {
      let id = Number(m[1]);
      const ext = id >= 0x80000000 || id > 0x7FF ? 1 : 0;
      id = id >= 0x80000000 ? id - 0x80000000 : id;
      if (m[2] === 'VECTOR__INDEPENDENT_SIG_MSG') { cur = null; continue; }

// ===========================================================================
// Firmware update
// ===========================================================================
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

const fw = { file: null, bytes: null, info: null, error: '', phase: 'idle', sent: 0, t0: 0, msg: '', result: null };

// Check a .bin: ESP32 app image with our tag, not a full-flash image, fits the slot.
function inspectFirmware(bytes) {
  if (bytes.length < 65536) return { error: 'This file is too small to be the isolator firmware.' };
  if (bytes[0] !== 0xE9) return { error: 'This isn’t an ESP32 firmware image (.bin).' };
  if (bytes.length > 0x8002 && bytes[0x8000] === 0xAA && bytes[0x8001] === 0x50)
    return { error: 'This is a full-flash image (bootloader + partitions + app). Use the app image instead: Firmware/CanIsolatorC6-<version>.bin, or firmware.bin from the PlatformIO build folder.' };
  const text = new TextDecoder('latin1').decode(bytes);
  const m = /CANISO-FW:([A-Za-z0-9_]+):([^:\x00]{1,32}):/.exec(text);
  if (!m) return { error: 'This firmware doesn’t carry the CAN isolator marker (firmware 2.4 or newer), so it may not be isolator firmware. Refusing to install it.' };
  if (m[1] !== 'CanIsolatorC6') return { error: `This is firmware for “${m[1]}”, not CanIsolatorC6.` };
  const max = state.hello?.otaMax;
  if (max && bytes.length > max) return { error: `The image is ${bytes.length.toLocaleString()} bytes; the update slot holds ${max.toLocaleString()}.` };
  return { name: m[1], version: m[2] };
}

function cmpVer(a, b) {
  const pa = String(a).split(/[.-]/).map(x => (isNaN(x) ? x : Number(x))), pb = String(b).split(/[.-]/).map(x => (isNaN(x) ? x : Number(x)));
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    if (pa[i] === undefined) return -1; if (pb[i] === undefined) return 1;
    if (pa[i] < pb[i]) return -1; if (pa[i] > pb[i]) return 1;
  }
  return 0;
}

async function fwPick(file) {
  fw.file = file; fw.bytes = new Uint8Array(await file.arrayBuffer());
  const r = inspectFirmware(fw.bytes);
  fw.info = r.error ? null : r; fw.error = r.error || ''; fw.phase = 'idle'; fw.result = null;
  renderTab(false);
}

async function fwInstall() {
  const cur = state.hello?.ver;
  if (!fw.info || !state.connected) return;
  const c = cmpVer(fw.info.version, cur);
  if (!confirm(`Install firmware ${fw.info.version} (now ${cur})${c < 0 ? ' — that is an OLDER version' : c === 0 ? ' — the same version' : ''}?\n\n` +
               'The isolator keeps forwarding while the file is sent (about 10 s), then restarts (about 1 s). Do this with the engine off.\n\n' +
               'If the new firmware doesn’t start properly, the board goes back to the current one by itself.')) return;
  if (state.editDirty && !confirm('You have edits in this page that are not on the board. They stay in this page, but the board restarts with its saved settings. Continue?')) return;
  const bytes = fw.bytes, CH = 512, WIN = 4;
  fw.phase = 'sending'; fw.sent = 0; fw.t0 = performance.now(); fw.msg = ''; fw.result = null;
  renderTab(false);
  const oldVer = cur;
  try {
    await locked(async () => {
      const b = await request(`ota begin ${bytes.length}`, null, 5000);
      if (b.t === 'err') throw new Error(b.msg);
      let sent = 0, acked = 0, crcAll = 0;
      const offs = []; for (let o = 0; o < bytes.length; o += CH) offs.push(o);
      // Replies arrive in order; keep up to WIN chunks in flight.
      const pending = [];
      const waitAck = () => new Promise((resolve, reject) => pending.push({ resolve, reject }));
      link.waiter = (o) => {
        if (o.re !== 'ota') return;
        const p = pending.shift(); if (!p) return;
        if (o.t === 'ok') p.resolve(o); else p.reject(new Error(o.msg));
      };
      const inflight = [];
      while (acked < offs.length) {
        while (sent < offs.length && sent - acked < WIN) {
          const o = offs[sent], ch = bytes.subarray(o, o + CH);
          crcAll = crc32(ch, crcAll);
          const pr = waitAck(); pr.catch(() => {}); inflight.push(pr);
          await sendRaw(`ota data ${o} ${crc32(ch).toString(16).padStart(8, '0')} ${b64(ch)}\n`);
          sent++;
        }
        const t = setTimeout(() => pending.forEach(p => p.reject(new Error('The board stopped answering during the update.'))), 5000);
        try { await inflight.shift(); } finally { clearTimeout(t); }
        acked++;
        fw.sent = Math.min(bytes.length, acked * CH);
        if (acked % 16 === 0 || acked === offs.length) updateFwProgress();
      }
      link.waiter = null;
      fw.phase = 'verifying'; updateFwProgress();
      const e = await request(`ota end ${crcAll.toString(16).padStart(8, '0')}`, null, 15000);
      if (e.t === 'err') throw new Error(e.msg);
    });
  } catch (err) {
    link.waiter = null;
    try { await cmd.simple('ota abort'); } catch {}
    fw.phase = 'idle'; fw.result = { ok: false, text: 'Update failed: ' + err.message + ' The board is still running ' + oldVer + '.' };
    renderTab(false);
    return;
  }
  // Restart into the new firmware and reconnect.
  fw.phase = 'restarting'; renderTab(false);
  await restartAndReconnect();
  if (!state.connected) {
    fw.phase = 'idle'; fw.result = { ok: false, text: 'The board restarted but this page couldn’t reconnect. Unplug and replug the USB cable, then Connect: the Status line shows which firmware is running.' };
    renderTab(false); return;
  }
  const h = state.hello;
  if (h.ver === fw.info.version && h.ver !== oldVer || (h.ver === oldVer && fw.info.version === oldVer && h.pendingVerify)) {
    fw.phase = 'confirming'; renderTab(false);
    for (let i = 0; i < 30 && state.connected; i++) {
      await new Promise(r => setTimeout(r, 1000));
      try { state.hello = await cmd.hello(); } catch {}
      if (!state.hello.pendingVerify) break;
    }
    const ok = state.hello.ver === fw.info.version && !state.hello.pendingVerify;
    fw.result = ok ? { ok: true, text: `Firmware ${state.hello.ver} is running and has confirmed itself.` }
                   : { ok: false, text: `The new firmware did not confirm itself; the board is running ${state.hello.ver}.` };
  } else {
    fw.result = { ok: false, text: `The new firmware didn’t start properly, so the board went back to ${h.ver} by itself. Nothing else changed.` };
  }
  fw.phase = 'idle';
  renderTab(false); updateHeader();
}

// After 'reboot' the USB port goes away and comes back; reopen it without the chooser.
async function restartAndReconnect() {
  try { await locked(() => sendRaw('reboot\n')); } catch {}
  await new Promise(r => setTimeout(r, 300));
  await disconnect();
  const t0 = Date.now();
  await new Promise(r => setTimeout(r, 1500));
  while (Date.now() - t0 < 30000) {
    const ports = (await navigator.serial.getPorts()).filter(p => (p.getInfo().usbVendorId ?? 0x303a) === 0x303a);
    for (const p of ports) {
      if (await openPort(p, true)) return true;
    }
    await new Promise(r => setTimeout(r, 700));
  }
  return false;
}

// ===========================================================================
// Custom route transforms: engine (mirror of xfApply in GenEngine.h)
// ===========================================================================
const XO = { SET_ID: 1, SET_LEN: 2, SET_FIELD: 3, COPY: 4, COND: 5, COUNTER: 6 };
const XO_LABEL = { 1: 'Change the ID', 2: 'Change the length', 3: 'Set a field to a value', 4: 'Copy a field (scaled)', 5: 'Forward only if…', 6: 'Rolling counter' };
const XC_LABEL = ['=', '≠', '<', '≤', '>', '≥', 'has all these bits', 'has any of these bits'];
const XS_THIS_JS = 2;

// frame: { id, ext, len, data[8] }; cached[i]: 8 data bytes of step i's cached source, or null.
// Returns { keep, id, ext, len, data, step (index of the dropping step), why }.
function xfApplyJs(x, frame, cached, counters) {
  let id = frame.id, ext = frame.ext, len = frame.len;
  const data = [...frame.data, 0, 0, 0, 0, 0, 0, 0, 0].slice(0, 8), orig = [...data], origLen = frame.len;
  for (let i = 0; i < x.ops.length; i++) {
    const o = x.ops[i];
    let src = null;
    if (o.kind === XO.COPY || o.kind === XO.COND) {
      src = o.srcBus === XS_THIS_JS ? (genFits(o.srcStart, o.srcLen, o.srcOrder, origLen) ? orig : null) : cached[i];
      if (!src) { if (o.flags & 1) continue; return { keep: false, step: i, why: o.srcBus === XS_THIS_JS ? 'the frame is too short for the source field' : 'the source frame is missing or stale' }; }
    }
    switch (o.kind) {
      case XO.SET_ID: id = o.srcId; ext = o.srcExt; break;
      case XO.SET_LEN: { const n = Math.max(0, Math.min(8, o.value)); for (let b = len; b < n; b++) data[b] = 0; len = n; break; }
      case XO.SET_FIELD: { const m = 2 ** o.dstLen; genPutJs(data, o.dstStart, o.dstLen, o.dstOrder, ((o.value % m) + m) % m); break; }
      case XO.COPY: {
        const raw = genGetJs(src, o.srcStart, o.srcLen, o.srcOrder);
        genPutJs(data, o.dstStart, o.dstLen, o.dstOrder, toField(genScaleJs(raw, o), o.dstLen));
        break;
      }
      case XO.COND: {
        const raw = genGetJs(src, o.srcStart, o.srcLen, o.srcOrder);
        const a = o.srcSigned && raw >= 2 ** (o.srcLen - 1) ? raw - 2 ** o.srcLen : raw;
        const v = o.value, vu = v >>> 0;
        const ok = [a === v, a !== v, a < v, a <= v, a > v, a >= v, ((raw & vu) >>> 0) === vu, ((raw & vu) >>> 0) !== 0][o.cmp];
        if (!ok) return { keep: false, step: i, why: `the condition is false (value ${a})` };
        break;
      }
      case XO.COUNTER: genPutJs(data, o.dstStart, o.dstLen, o.dstOrder, (counters?.[i] ?? 0) % 2 ** o.dstLen); break;
    }
  }
  return { keep: true, id, ext, len, data: data.slice(0, len) };
}

function newStep(kind) {
  return { kind, srcBus: XS_THIS_JS, srcId: 0, srcExt: 0, srcStart: 7, srcLen: 8, srcOrder: BO_MOT, srcSigned: 0,
           dstStart: 7, dstLen: 8, dstOrder: BO_MOT, dstSigned: 0, value: 0, factor: 1, offset: 0, staleMs: 500, cmp: 0, step: 1, flags: 0 };
}

function xfIssues(m, xi) {
  const x = m.xforms[xi], e = [], w = [];
  if (!x.ops.length) w.push('no steps: frames pass unchanged');
  x.ops.forEach((o, i) => {
    const n = `step ${i + 1}`;
    const usesDst = [XO.SET_FIELD, XO.COPY, XO.COUNTER].includes(o.kind), usesSrc = [XO.COPY, XO.COND].includes(o.kind);
    if (usesDst && !genFits(o.dstStart, o.dstLen, o.dstOrder, 8)) e.push(`${n}: field doesn’t fit in 8 bytes`);
    if (usesSrc && !genFits(o.srcStart, o.srcLen, o.srcOrder, 8)) e.push(`${n}: source field doesn’t fit in 8 bytes`);
    if (usesSrc && o.srcBus !== XS_THIS_JS && !(o.srcId >= 0 && o.srcId <= maxId(o.srcExt))) e.push(`${n}: bad source ID`);
    if (o.kind === XO.SET_ID && !(o.srcId >= 0 && o.srcId <= maxId(o.srcExt))) e.push(`${n}: bad ID`);
    if (o.kind === XO.SET_LEN && !(o.value >= 0 && o.value <= 8)) e.push(`${n}: length 0-8`);
    if ([XO.SET_FIELD, XO.COND].includes(o.kind) && !Number.isInteger(o.value)) e.push(`${n}: value must be a whole number`);
    if (o.kind === XO.COPY && (!Number.isFinite(o.factor) || !Number.isFinite(o.offset))) e.push(`${n}: factor / offset must be numbers`);
    if (usesSrc && !(o.staleMs >= 0 && o.staleMs <= 65535)) e.push(`${n}: stale time 0-65535 ms`);
    if (o.kind === XO.COUNTER && !(o.step >= 0 && o.step <= 255)) e.push(`${n}: step 0-255`);
  });
  const used = m.routes.filter(r => r.xf === (state.hello?.xfCustom ?? 2) + xi);
  if (used.some(r => r.minMs || r.onChange) && x.ops.some(o => o.kind === XO.COUNTER)) w.push('a route using this is rate-limited: counter values it holds back are skipped');
  return { e, w };
}
