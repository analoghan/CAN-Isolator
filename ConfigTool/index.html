const xfTest = {};   // per transform: { id, ext, len, data, cached: { [step]: bytes[] } }

function parseSignedNum(s) {
  s = String(s).trim();
  const neg = s.startsWith('-'); if (neg) s = s.slice(1);
  const v = /^0x/i.test(s) || isHex() ? parseHex(s) : parseIntSafe(s);
  return Number.isFinite(v) ? (neg ? -v : v) : NaN;
}
const fmtNum = (v) => !Number.isFinite(v) ? '' : v < 0 ? '-' + fmtNum(-v) : isHex() ? v.toString(16).toUpperCase() : String(v);

function transformsView() {
  const m = state.edit;
  const max = state.hello?.maxXf ?? 8;
  return h('div', {},
    h('div', { class: 'panel' },
      h('h2', {}, 'Route transforms'),
      h('p', { class: 'hint' }, 'A transform rewrites the frames a route forwards: a list of steps applied in order. Pick it in a route’s Transform column. ',
        'Steps can change the ID or length, set a field to a value (also how you clear or set bits), copy a field from this frame or another frame with scaling, forward only if a field matches, or add a rolling counter. ',
        'Fields use DBC bit numbering (Motorola: start = highest bit; Intel: start = lowest bit). “This frame” means the frame as received, before any step.'),
      h('div', { class: 'toolbar', style: 'margin:0' },
        h('button', { disabled: m.xforms.length >= max, onclick: () => { m.xforms.push({ name: 'Transform ' + (m.xforms.length + 1), ops: [] }); markDirty(); renderTab(false); } }, '+ Add transform'),
        h('span', { class: 'muted' }, `${m.xforms.length} of ${max}`))),
    m.xforms.map((x, xi) => xfCard(m, x, xi)));
}

// Moving / deleting a transform renumbers the routes that use them.
function xfRemap(m, fn) {
  const base = state.hello?.xfCustom ?? 2;
  m.routes.forEach(r => { if (r.xf >= base) { const n = fn(r.xf - base); r.xf = n === null ? 0 : base + n; } });
}

function xfCard(m, x, xi) {
  const base = state.hello?.xfCustom ?? 2;
  const users = m.routes.map((r, i) => ({ r, i })).filter(({ r }) => r.xf === base + xi);
  const refresh = () => { markDirty(); const el = $('#xf-side-' + xi); if (el) el.replaceWith(xfSide(m, x, xi)); };
  const full = () => { markDirty(); renderTab(false); };
  const num = (o, key, cls, opts = {}) => h('input', { class: cls || 'ms', value: opts.signed ? fmtNum(o[key]) : Number.isFinite(o[key]) ? o[key] : '', title: opts.title,
    oninput: (ev) => { const t = ev.target.value.trim(); const v = opts.float ? (t === '' ? NaN : Number(t)) : opts.signed ? parseSignedNum(t) : parseIntSafe(t);
      ev.target.classList.toggle('bad', !Number.isFinite(v)); o[key] = v; refresh(); } });
  const idIn = (o) => h('input', { class: 'id', value: fmtId(o.srcId, o.srcExt), oninput: (ev) => { const v = parseId(ev.target.value); ev.target.classList.toggle('bad', !Number.isFinite(v)); o.srcId = v; refresh(); } });
  const sel = (o, key, opts, fullRender) => h('select', { onchange: (ev) => { o[key] = +ev.target.value; fullRender ? full() : refresh(); } },

  const orderOpts = [[BO_MOT, 'Motorola'], [BO_INTEL, 'Intel']];
  const field = (o, p, signedToo) => [h('label', {}, 'start bit ', num(o, p + 'Start')), h('label', {}, 'length ', num(o, p + 'Len')), sel(o, p + 'Order', orderOpts), signedToo ? chk(o, p + 'Signed', 'signed') : null];

  const steps = x.ops.map((o, si) => {

    const source = () => [
      h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'From'),
        sel(o, 'srcBus', [[XS_THIS_JS, 'this frame'], [0, 'a Bus A frame'], [1, 'a Bus B frame']], true),
        o.srcBus !== XS_THIS_JS ? [idIn(o), chk(o, 'srcExt', '29-bit', true)] : null,

        h('label', {}, 'if missing or stale: ', sel(o, 'flags', [[0, 'drop the frame'], [1, 'skip this step']]))) : null];
    if (o.kind === XO.SET_ID) body = h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'New ID'), idIn(o), chk(o, 'srcExt', '29-bit', true));
    else if (o.kind === XO.SET_LEN) body = h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'New length'), sel(o, 'value', [0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => [n, n + ' bytes'])), h('span', { class: 'muted' }, 'added bytes are 0'));
    else if (o.kind === XO.SET_FIELD) body = h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'Field'), field(o, 'dst'),
      h('label', {}, `value (${isHex() ? 'hex' : 'dec'}) `, num(o, 'value', 'id', { signed: true })), h('span', { class: 'muted' }, 'e.g. length 1 + value 0 clears a bit'));
    else if (o.kind === XO.COPY) body = [source(),
      h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'Math'),
        h('label', {}, 'out = raw × ', num(o, 'factor', 'num', { float: true })), h('label', {}, ' + ', num(o, 'offset', 'num', { float: true })), unitsHelper(o, null)),
      h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'Into field'), field(o, 'dst', true))];
    else if (o.kind === XO.COND) body = [source(),
      h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'Forward if'), h('span', {}, 'value '),
        sel(o, 'cmp', XC_LABEL.map((t, i) => [i, t])), num(o, 'value', 'id', { signed: true }), h('span', { class: 'muted' }, `(${isHex() ? 'hex' : 'dec'}, raw value)`))];
    else if (o.kind === XO.COUNTER) body = h('div', { class: 'toolbar', style: 'margin:6px 0 0' }, h('b', { style: 'width:110px' }, 'Field'), field(o, 'dst'),
      h('label', {}, 'add ', num(o, 'step'), ' per forwarded frame'));
    return h('div', { class: 'field-card', style: 'border-left-color:var(--accent)' },
      h('div', { class: 'toolbar', style: 'margin:0' }, h('span', { class: 'swatch', style: 'background:var(--accent)' }, String(si + 1)),
        h('b', {}, XO_LABEL[o.kind]), h('span', { class: 'spacer' }),
        h('button', { class: 'small', disabled: si === 0, onclick: () => { [x.ops[si - 1], x.ops[si]] = [x.ops[si], x.ops[si - 1]]; full(); } }, '↑'),
        h('button', { class: 'small', disabled: si === x.ops.length - 1, onclick: () => { [x.ops[si + 1], x.ops[si]] = [x.ops[si], x.ops[si + 1]]; full(); } }, '↓'),
        h('button', { class: 'small danger', onclick: () => { x.ops.splice(si, 1); full(); } }, 'Remove')),
      body);
  });

  const maxOps = state.hello?.maxXfOps ?? 6;
  const adder = h('select', { disabled: x.ops.length >= maxOps, onchange: (ev) => {
    const k = +ev.target.value; if (!k) return;
    const st = newStep(k);
    if (k === XO.SET_LEN) st.value = 8;
    if (k === XO.COUNTER) { st.dstStart = 0; st.dstLen = 4; st.dstOrder = BO_INTEL; }
    if (k === XO.SET_ID) st.srcId = 0x700;
    x.ops.push(st); full();
  } }, h('option', { value: 0 }, x.ops.length >= maxOps ? `Max ${maxOps} steps` : '+ Add a step…'), Object.entries(XO_LABEL).map(([k, t]) => h('option', { value: k }, t)));

  return h('div', { class: 'panel gen-card', id: 'xf-' + xi },
    h('div', { class: 'toolbar', style: 'margin-bottom:6px' },
      h('input', { value: x.name, maxlength: state.hello?.genNameLen ?? 23, style: 'width:220px;font-weight:600', oninput: (ev) => {
        const c = ev.target.value.replace(/[^\x20-\x7e]|["\\]/g, ''); if (c !== ev.target.value) ev.target.value = c; x.name = c; markDirty(); } }),
      h('span', { class: 'muted' }, users.length ? 'Used by ' + users.map(({ r, i }) => `row ${i + 1} (${fmtId(r.first, r.ext)})`).join(', ') : 'Not used by any route yet'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'small', disabled: xi === 0, onclick: () => { [m.xforms[xi - 1], m.xforms[xi]] = [m.xforms[xi], m.xforms[xi - 1]]; xfRemap(m, k => k === xi ? xi - 1 : k === xi - 1 ? xi : k); full(); } }, '↑'),
      h('button', { class: 'small', disabled: xi === m.xforms.length - 1, onclick: () => { [m.xforms[xi + 1], m.xforms[xi]] = [m.xforms[xi], m.xforms[xi + 1]]; xfRemap(m, k => k === xi ? xi + 1 : k === xi + 1 ? xi : k); full(); } }, '↓'),
      h('button', { class: 'small', disabled: m.xforms.length >= (state.hello?.maxXf ?? 8), onclick: () => { m.xforms.splice(xi + 1, 0, JSON.parse(JSON.stringify({ ...x, name: (x.name + ' copy').slice(0, 23) }))); xfRemap(m, k => k > xi ? k + 1 : k); full(); } }, '⧉'),
      h('button', { class: 'small danger', onclick: () => {
        if (!confirm(`Delete “${x.name}”?` + (users.length ? ` ${users.length} route(s) using it will go back to no transform.` : ''))) return;

// Right side: test a frame through the transform.
function xfSide(m, x, xi) {
  const t = xfTest[xi] = xfTest[xi] || { id: m.routes.find(r => r.xf === (state.hello?.xfCustom ?? 2) + xi)?.first ?? 0x100, ext: 0, len: 8, data: [0, 0, 0, 0, 0, 0, 0, 0], cached: {} };
  const rerun = () => { const el = $('#xf-out-' + xi); if (el) el.replaceWith(xfOut(x, xi)); };
  const bytesIn = (arr, n, onCh) => Array.from({ length: n }, (_, i) => h('input', { class: 'byte mono', value: fmtByte(arr[i] ?? 0), oninput: (ev) => {
    const b = parseByte(ev.target.value); ev.target.classList.toggle('bad', !Number.isFinite(b)); if (Number.isFinite(b)) { arr[i] = b; onCh(); } } }));
  const cachedSteps = x.ops.map((o, i) => ({ o, i })).filter(({ o }) => (o.kind === XO.COPY || o.kind === XO.COND) && o.srcBus !== XS_THIS_JS);
  const { e, w } = xfIssues(m, xi);
  return h('div', { class: 'gen-side', id: 'xf-side-' + xi },
    h('b', {}, 'Try it'),
    h('p', { class: 'hint', style: 'margin:2px 0 6px' }, 'A received frame, as the route would see it:'),
    h('div', { class: 'toolbar', style: 'margin:0 0 6px' }, h('label', {}, 'ID ', h('input', { class: 'id', value: fmtId(t.id, t.ext), oninput: (ev) => { const v = parseId(ev.target.value); if (Number.isFinite(v)) { t.id = v; rerun(); } } })),
      h('label', {}, 'length ', h('select', { onchange: (ev) => { t.len = +ev.target.value; refreshXfSide(xi); } }, [0, 1, 2, 3, 4, 5, 6, 7, 8].map(n => h('option', { value: n, selected: t.len === n }, n))))),
    h('div', { style: 'display:flex;gap:4px;flex-wrap:wrap' }, bytesIn(t.data, t.len, rerun)),
    cachedSteps.map(({ o, i }) => {
      const arr = t.cached[i] = t.cached[i] || [0, 0, 0, 0, 0, 0, 0, 0];
      return h('div', { style: 'margin-top:8px' },
        h('div', { class: 'hint', style: 'margin:0 0 2px' }, `Step ${i + 1} source: Bus ${o.srcBus ? 'B' : 'A'} ${fmtId(o.srcId, o.srcExt)} `,
          h('label', {}, h('input', { type: 'checkbox', checked: arr.missing, onchange: (ev) => { arr.missing = ev.target.checked; rerun(); } }), ' missing')),
        h('div', { style: 'display:flex;gap:4px;flex-wrap:wrap' }, bytesIn(arr, 8, rerun)));

    xfOut(x, xi),
    e.length || w.length ? h('div', { class: 'warnings', style: 'margin-top:10px;max-width:none' }, e.map(z => h('span', { class: 'e' }, z)), w.map(z => h('span', { class: 'w' }, z))) : null);
}

function refreshXfSide(xi) { const el = $('#xf-side-' + xi); if (el) el.replaceWith(xfSide(state.edit, state.edit.xforms[xi], xi)); }

function xfOut(x, xi) {
  const t = xfTest[xi];
  const cached = x.ops.map((o, i) => t.cached[i] && !t.cached[i].missing ? t.cached[i] : null);
  let r;
  try { r = xfIssues(state.edit, xi).e.length ? null : xfApplyJs(x, { id: t.id, ext: t.ext, len: t.len, data: t.data }, cached, []); } catch { r = null; }
  return h('div', { id: 'xf-out-' + xi, style: 'margin-top:10px' },
    !r ? h('span', { class: 'muted' }, 'Fix the problems below to see the result.')
      : r.keep ? [h('span', { class: 'muted' }, 'Sent as: '), h('b', { class: 'mono' }, fmtId(r.id, r.ext)), r.ext ? ' (29-bit)' : '', h('span', { class: 'muted' }, ` [${r.len}] `),
                  h('span', { class: 'mono gen-preview' }, fmtBytes(r.data.map(v => v.toString(16).padStart(2, '0')).join('')))]
      : h('span', {}, h('span', { class: 'badge bad' }, 'Dropped'), ` at step ${r.step + 1}: ${r.why}.`));
}

<li>Start on the <b>Status</b> tab: both buses should say <i>Active</i>, and the received counts should move when the car is on.</li>
</ol>
<div class="callout"><b>Changing settings safely.</b> <b>Send to board</b> runs your edits straight away, but only in memory: a power cycle goes back to the saved settings. Try a change, check it, then <b>Save to board</b> to keep it. If something goes wrong, <b>More… → Board: go back to saved settings</b> undoes it instantly.</div>
<p><b>Save to board</b> first lists exactly what will change compared with the settings saved on the board (routes added, removed or changed, bus settings, generated frames, transforms), so you can cancel if something is unexpected. <b>Review changes</b> shows the same list for your unsent edits; tick “Also show this before every Send to board” if you want it on every Send too.</p>
<p>The coloured label at the top tells you where the board stands: <i>running its saved settings</i>, <i>running unsaved settings (lost at power-off)</i>, or <i>restart needed</i> (bit rate or connector changes only take effect after Save + restart).</p>
<p>Press <kbd>?</kbd> on any tab, or click <b>? Help</b>, to jump to the help for that tab.</p>` },

  { id: 'concepts', group: 'Basics', title: 'How the isolator works', html: `
<p>The isolator sits between two separate CAN networks and decides, frame by frame, what crosses:</p>
<div class="help-diagram">
  <div class="hd-box hd-a">Bus A<small>chassis side: ABS, wheel, gauges, cluster…</small></div>
  <div class="hd-arrow">⇄</div>
  <div class="hd-box hd-iso">Isolator<small>routes · transforms · generated frames · filter</small></div>
  <div class="hd-arrow">⇄</div>
  <div class="hd-box hd-b">Bus B<small>standalone ECU</small></div>
</div>
<p class="muted" style="margin-top:0">By default: <b>A → B</b> only what the route table allows (a whitelist), <b>B → A</b> everything.</p>
<p>For every frame it receives, the isolator decides in this order:</p>
<ol>
<li><b>Generated copy?</b> If the isolator itself builds a frame with this ID (Generated frames tab) and the frame arrived on the <i>other</i> bus, it is dropped, so the receiver never sees two sources.</li>
<li><b>First matching route.</b> The route table is read top to bottom; the first row whose ID (or range), ID type (11/29-bit) and direction match decides: <i>Drop</i>, or <i>Pass</i> (optionally through a transform, rate limit or on-change rule).</li>
<li><b>Default.</b> IDs with no matching row follow the default for that direction (Bus settings). Normally A → B drops (a whitelist that protects the ECU) and B → A passes.</li>
</ol>
<p>The isolator also <b>builds frames on a timer</b> (Generated frames) from data it caches, and can merge steering-wheel bytes into another frame (Buttons). Frames that cannot be sent within the <i>TX max age</i> (50 ms by default) are thrown away rather than sent late.</p>
<p>A is always the chassis side and B the ECU, whichever physical connector they’re on (see <i>Connectors</i> under Bus settings).</p>` },

  { id: 'status', group: 'Tabs', title: 'Status tab', html: `
<p>Live numbers, refreshed once a second.</p>
<ul>
<li><b>Bus state:</b> <i>Active</i> is normal. <i>Warning</i> means errors are building up. <i>Error passive</i> usually means nothing is acknowledging the isolator’s frames (other node off, wiring, termination). <i>Bus-off</i> means the controller took itself off the bus; the isolator recovers automatically and counts the event.</li>
<li><b>Received / Forwarded / Filtered / Rate-limited / Sent</b> are frames per second. <i>Filtered</i> = dropped by a route, the default, a transform, or as a generated copy. <i>Rate-limited</i> = held back by a Min ms or On change rule.</li>
<li><b>TX / RX errors</b> are the controller’s error counters (0 is ideal). <b>Bus errors</b> counts error frames seen.</li>
<li><b>RX overflow</b> (the isolator couldn’t keep up) and <b>TX overflow</b> (the outgoing queue was full) should stay 0. <b>Stale TX dropped</b> rises when the far bus can’t take frames (unplugged, ECU off, overloaded).</li>
<li><b>CPU used by routing</b>, <b>Slowest frame</b>: processing cost. <b>Longest loop pause</b> and <b>Longest wait before routing</b>: the worst delay in the last second. With nothing connected they stay well under 1 ms; while this page monitors traffic they can reach ~1.5 ms.</li>
<li><b>Hardware filter</b> line: whether Bus A’s filter is on, how many IDs it lets through, or why it’s off. Frames it rejects don’t appear in Bus A’s counts.</li>
<li><b>Generated frames</b>: rate sent, periods skipped because a source frame was missing (<i>No source</i>), the bytes sent, and the ECU’s own copy if it still sends one. <i>Check</i> compares the constant bits of the ECU copy with the isolator’s: any <i>constant mismatch</i> means the definition differs from the ECU’s.</li>
<li><b>Bus load</b> (firmware 2.6+): the share of each bus’s capacity in use, from the frames the isolator receives and sends, with the busiest 100 ms as the <i>peak</i>. The chart covers the last 15 minutes while the page is connected. Above about 70 % frames start waiting; above 90 % expect delays and TX overflows. With Bus A’s hardware filter on, rejected frames aren’t counted, so Bus A reads low.</li>
<li><b>Event history</b> (firmware 2.6+): every state change (warning, error passive, bus-off, back to normal) and every burst of bus errors, overflows or stale frames since the isolator started, with the time. It is kept on the isolator, so you can drive with the laptop unplugged and read it afterwards, as long as the isolator stayed powered (it is cleared at power-off). Repeats within 2 s are merged into one line with a count.</li>
</ul>` },

  { id: 'routes', group: 'Tabs', title: 'Routes tab', html: `
<p>The route table decides what crosses between the buses. <b>The first matching row wins</b> (ID, ID type and direction must match), so put specific rows above ranges they should override.</p>
<table class="help-table">
<tr><th>Column</th><th>Meaning</th></tr>
<tr><td>ID / Range end</td><td>One ID, or an inclusive range (leave Range end blank for one ID). Shown and typed in hex or decimal (switch at the top); <code>0x…</code> always means hex.</td></tr>
<tr><td>29-bit</td><td>Extended ID. 0x123 as 11-bit and 0x123 as 29-bit are different frames.</td></tr>
<tr><td>Direction</td><td>A → B, B → A or Both.</td></tr>
<tr><td>Action</td><td>Pass forwards; Drop blocks. Use Drop rows to carve holes in a Pass range, or to block an ID the default would pass.</td></tr>
<tr><td>Transform</td><td><i>Merge wheel buttons</i> (Buttons tab) or one of your transforms (Transforms tab).</td></tr>
<tr><td>Min ms</td><td>Rate limit: forward at most once per this many ms. The newest data always wins, so the far side never holds stale data (a 100 Hz frame with Min ms 100 arrives at 10 Hz).</td></tr>
<tr><td>On change</td><td>Forward only when the data differs from what was last sent.</td></tr>
<tr><td>Heartbeat</td><td>With On change: resend unchanged data at least this often so receivers don’t time out.</td></tr>
<tr><td>Note</td><td>Your label (23 characters). If a DBC file is loaded, an empty note shows the message name in grey.</td></tr>
</table>
<p>Warnings appear next to rows that won’t behave as you might expect: rate limits on ranges (ignored), heartbeat without on-change, and rows that can never match because an earlier row covers them. Errors (red) must be fixed before sending.</p>
<p>Use the <b>ID sniffer</b> to see which IDs exist and what the current table does with each one, and its <b>+ route</b> button to add a row.</p>` },

  { id: 'transforms', group: 'Tabs', title: 'Transforms tab', html: `
<p>A transform rewrites the frames a route forwards. It is a list of up to 6 steps run in order; up to 8 transforms. Pick one in a route’s <b>Transform</b> column.</p>
<table class="help-table">
<tr><th>Step</th><th>What it does</th></tr>
<tr><td>Change the ID</td><td>The frame leaves under another ID (11- or 29-bit).</td></tr>
<tr><td>Change the length</td><td>0–8 data bytes; new bytes are 0. Add this first if later steps write past the received length.</td></tr>
<tr><td>Set a field to a value</td><td>Writes a constant into a bit field. This is how you clear or set bits (a 1-bit field with value 0 or 1) or overwrite bytes.</td></tr>
<tr><td>Copy a field (scaled)</td><td>Reads a field from <i>this frame</i> (as received) or from the latest copy of <i>another frame</i> on Bus A or B, computes <code>out = raw × factor + offset</code>, rounds, clamps to the destination field, and writes it.</td></tr>
<tr><td>Forward only if…</td><td>Compares a field’s raw value with a number (=, ≠, &lt;, ≤, &gt;, ≥, has all these bits, has any of these bits). If false the frame is dropped.</td></tr>
<tr><td>Rolling counter</td><td>Writes a counter that steps for every forwarded frame and wraps at the field size.</td></tr>
</table>
<p><b>Other-frame sources</b> have a stale time: if that frame is missing or older, the step either drops the frame or is skipped (your choice). The isolator caches the source automatically, and Bus A’s hardware filter lets it through.</p>
<p><b>Try it</b> runs a test frame through the transform with exactly the firmware’s math and shows what would be sent, or which step drops it and why.</p>
<p>Notes: steps that read “this frame” see it as received, before any step. A rolling counter on a rate-limited route skips the values the limiter holds back. Deleting or reordering transforms renumbers the routes that use them.</p>` },

  { id: 'buttons', group: 'Tabs', title: 'Buttons tab (wheel merge)', html: `
<p>Copies bytes of the steering wheel frame into another frame, so the ECU can read extra buttons without another receive slot. Routes that use the <b>Merge wheel buttons</b> transform get these bytes (by default the ABS frame 0x2B2).</p>
<ul>
<li><b>Wheel byte → Into byte:</b> which byte goes where (bytes numbered 1–8). <b>Bit mask</b> (hex): which bits are copied; the others keep the original frame’s value.</li>
<li><b>Catch taps:</b> also reports a press that started and ended between two frames, for one frame. It is not a latch. Only use it on bytes where every bit is one button, because it ORs values together.</li>
<li><b>Wheel timeout:</b> if the wheel frame is older than this, mapped bits read 0 (released). Until the wheel has been seen once, the frame passes through unchanged.</li>
</ul>
<p>The wheel frame itself is still forwarded by its own route; this is an extension, not a replacement.</p>` },

  { id: 'generated', group: 'Tabs', title: 'Generated frames tab', html: `
<p>Frames the isolator builds and sends on a timer: up to 8, each with an ID, bus, period, length, constant bytes, and up to 4 fields written over them. The factory defaults are three cluster frames for the original install (an Aston Martin dash); replace or turn them off for other cars.</p>
<ul>
<li><b>Copied from a frame:</b> a field of a cached source frame (any ID, either bus), rescaled with <code>out = raw × factor + offset</code>, rounded half up and clamped to the field.</li>
<li><b>Rolling counter:</b> adds <i>step</i> every frame sent, wrapping at the field size.</li>
<li><b>Source rule:</b> a frame is only sent while every source is fresh (younger than its stale time). ECU off → the frames stop, as they would if the ECU sent them itself.</li>
<li><b>Other-bus copy:</b> while a frame is <b>On</b>, a frame with the same ID arriving on the other bus (the ECU’s own copy) is dropped, and checked against the isolator’s on the Status tab. Turn a frame off to pass the ECU’s copy through instead.</li>
</ul>
<p><b>Picking bits:</b> click “Pick bits in the grid”, then the first and last bit in the frame grid. <b>Use a saved signal / DBC signal</b> fills a source from the bit analyzer or a DBC file. <b>Work it out from units…</b> turns “physical = raw × scale + offset” on both sides into the factor and offset.</p>
<p>The <b>preview</b> uses exactly the firmware’s math, so the bytes it shows are the bytes the board sends for those test values.</p>` },

  { id: 'settings', group: 'Tabs', title: 'Bus settings tab', html: `
<ul>
<li><b>Bit rates</b> for each bus (125k / 250k / 500k / 1M). Take effect after Save + restart.</li>
<li><b>Connectors:</b> normally Bus A is on CAN0 and Bus B on CAN1; swap if the harness is the other way round. Only the physical connector changes. Takes effect after Save + restart.</li>
<li><b>IDs not in the route table:</b> A → B <i>Drop</i> (whitelist) is what protects the ECU from the chassis bus. B → A <i>Pass</i> keeps every chassis-side device that listens to the ECU working.</li>
<li><b>Hardware filter on Bus A:</b> the CAN controller rejects chassis-side frames the isolator has no use for, so they cost no CPU. Worked out from the routes automatically. It is off when A → B passes unrouted IDs or when anything needed from Bus A is 29-bit (in this mode the hardware rejects every 29-bit frame), and opens while the sniffer or monitor captures Bus A.</li>
<li><b>TX max age:</b> a frame that can’t be sent within this time is discarded instead of sent late. Keep it a little above your slowest important period.</li>
</ul>` },

  { id: 'sniffer', group: 'Tabs', title: 'ID sniffer tab', html: `
<p>Lists every ID received on each bus (up to 200 per bus), how often it arrives, its latest data, and what the route table <i>in this page</i> would do with it (including unsent edits). Grey rows haven’t been seen for 3 seconds.</p>
<ul><li><b>+ route</b> adds a route row for that ID in the matching direction.</li><li><b>monitor</b> opens it in the frame monitor and bit analyzer.</li></ul>
<p>The sniffer only runs while this tab is open (it stops by itself 5 seconds after the page stops asking), and Bus A’s hardware filter opens while it runs so you see everything.</p>
<h4>What changed? (firmware 2.6+)</h4>
<p>Finds the bits behind a button, switch or lever, even on a busy bus, because the isolator itself notes every bit that flips in every frame (nothing is missed between updates).</p>
<ol>
<li>Tick the bus(es) to watch.</li>
<li><b>1 · Background:</b> with everything still (engine state as it will be during the test), press <b>Record background</b>. For 10 s it learns which bits change by themselves: counters, sensor values, checksums. These are ignored.</li>
<li><b>2 · Action:</b> press <b>Start</b>, do the thing a few times (press and release the button), press <b>Stop</b>. Repeat for a second and third try.</li>
<li>The results list the IDs and bits that changed during the action but not in the background, with how many tries they appeared in. The real signal shows up in every try. <i>new ID</i> means the frame only appeared during the action.</li>
<li><b>analyze</b> opens the frame in the bit analyzer with the changed bits already selected; <b>+ route</b> adds a route for it.</li>
</ol>
<p>Tips: keep the background long enough to catch slow-changing values, and do the action several times in each try. If nothing shows up, the signal may sit on a bit that also changes by itself (record a shorter background) or on the other bus.</p>` },

  { id: 'monitor', group: 'Tabs', title: 'Frame monitor and bit analyzer', html: `
<p>The <b>monitor</b> captures individual frames with 0.1 ms timestamps: received on a bus (A RX, B RX) or sent by the isolator after routing and transforms (A TX, B TX). Add up to 8 filters (one ID, a range, or all IDs) and press Start. Changed bytes are highlighted and Δt is the time since the previous frame with that ID. <b>Save as CSV</b> exports the capture.</p>
<p>A whole busy bus is more than USB can carry; lost frames are counted, so filter to the IDs you need. The page keeps the last 100,000 frames.</p>
<p><b>Bit analyzer</b> (click a frame):</p>
<ul>
<li>The grid shows the latest frame’s bits; <b>brighter cells change more often</b>, which is the quickest way to find where a value lives.</li>
<li>Click the first and last bit of a value, choose Motorola or Intel, signed, factor and offset: the value is decoded live, with min/max and a chart over the capture.</li>
<li><b>Worth a look</b> suggests changing bytes, 16-bit values in both byte orders, and rolling counters.</li>
<li><b>Save signal</b> keeps it (in this browser and in exported settings files). With a DBC file loaded, all its signals for that frame are listed and decoded; click one to chart it.</li>
<li><b>Copy to sender</b> puts the latest frame into the test-frame sender.</li>
</ul>` },

  { id: 'graph', group: 'Tabs', title: 'Graph tab', html: `
<p>Plots signals over time, one chart per signal on a shared time axis. Hover any chart to read every signal at that moment.</p>
<ul>
<li><b>Add signals</b> from your DBC files (type part of the name), from signals saved in the bit analyzer, or the analyzer’s current selection. Choose where the frame is captured: <i>A RX</i> / <i>B RX</i> (received on a bus) or <i>A TX</i> / <i>B TX</i> (what the isolator sends, after transforms). The signal list is kept in this browser.</li>
<li><b>Data:</b> <i>Live</i> uses the frame monitor. Press <b>Capture these live</b> to add monitor filters for just these IDs and start it. <i>Last recording</i> and <i>Loaded log file</i> plot from the Record &amp; replay tab, so you can study a drive afterwards.</li>
<li><b>Show</b> picks the time window. Long recordings are thinned for drawing but keep their highs and lows, so spikes still show.</li>
<li>Named values from the DBC (for example gear positions) are shown as text next to the number.</li>
</ul>
<p>Use it to check scaling (does the value match the gauge?), to compare a transformed or generated value (TX) with its source (RX), or to watch a value during a drive.</p>` },

  { id: 'replay', group: 'Tabs', title: 'Record & replay tab', html: `
<h4>Record</h4>
<p>Records frames with their timing, using the frame monitor: either everything on the ticked buses, or just the monitor’s filters. Leave the page open while it records. The counts show the frames, the length and any frames lost over USB. A whole busy bus can be more than USB carries, so record only what you need if <i>Lost</i> climbs. Save the recording as a <b>candump log</b> (opens in SavvyCAN, can-utils and most CAN tools) or as <b>CSV</b>. It is also ready to replay straight away.</p>
<h4>Replay (firmware 2.6+)</h4>
<p>Load a log file (candump <code>-l</code> logs, CSV from this tool or SavvyCAN, Vector <code>.asc</code>), or use the last recording. Each channel in the file is replayed one of these ways:</p>
<ul>
<li><b>Feed in as received on Bus A / B:</b> each frame goes through the isolator exactly as if it had arrived on that bus: routes, rate limits, transforms, generated-frame sources. Use it on the bench: replay a drive recorded on Bus A into the isolator with only the ECU (or a dash) connected, and check what comes out with the monitor (A TX / B TX). These frames are counted as received on Status but not in the bus load.</li>
<li><b>Send on Bus A / B:</b> puts the frames straight onto the bus, bypassing the route table, like test frames.</li>
<li><b>Skip</b> leaves that channel out.</li>
</ul>
<p>Options: speed (¼× to 4×), loop, a time range, and an ID list (only these, or all except these; ranges like <code>100-1FF</code>).</p>
<p>The page streams the frames and the isolator times them itself to within about a millisecond. <i>Late</i> counts frames more than 50 ms behind their time. <i>Pauses</i> counts times the stream fell behind and playback paused instead of bursting. Replay stops by itself 5 seconds after this page closes or the cable is pulled.</p>
<div class="callout warn">Frames sent with <b>Send on</b> go onto the real bus. On the car they can trigger warnings or change what modules do. Replay with the engine off, and prefer <i>Feed in</i> for testing settings.</div>` },

  { id: 'send', group: 'Tabs', title: 'Send test frames tab', html: `
<p>Puts a frame straight onto a bus, bypassing the routes: once, or repeated on a timer in up to 4 slots.</p>
<div class="callout warn"><b>These are real frames on a real bus.</b> On the car they can trigger warnings, change what an ECU or the cluster does, or clash with a real node using the same ID. The page asks once per session before the first send.</div>
<p>Repeating frames stop by themselves 5 seconds after the page goes quiet (closed, crashed, cable pulled), so a forgotten test can never keep sending.</p>` },

  { id: 'dbc', group: 'Tabs', title: 'DBC files tab', html: `
<p>Load CAN database files (<code>.dbc</code>), such as your ECU maker’s files or your steering wheel’s, so the sniffer and monitor show message names, the bit analyzer decodes every signal with units and value names, and generated-frame or transform sources can be picked by signal name.</p>
<ul>
<li>Set which bus each file <b>describes</b>, so an ID used differently on the two buses isn’t mixed up. When two files define the same ID, the one higher in the list wins.</li>
<li>Files are kept in this browser only; nothing goes to the board.</li>
<li><b>Browse</b> searches IDs, message names and signal names.</li>
</ul>` },

  { id: 'bits', group: 'Reference', title: 'Bit numbering (Motorola and Intel)', html: `
<p>All bit positions follow DBC files: <b>bit = byte × 8 + bit-in-byte</b>, where bit 0 of a byte is its least significant bit. Byte 0 is the first data byte (“byte 1” in many documents).</p>
<div class="help-bits">
  <div><b>Motorola (big-endian), start 7, length 16</b><br><span class="muted">Start = the <i>highest</i> bit. The field runs down to bit 0 of byte 0, then continues at bit 7 of the <i>next</i> byte.</span>${helpBitGrid(7, 16, 0)}</div>
  <div><b>Intel (little-endian), start 0, length 16</b><br><span class="muted">Start = the <i>lowest</i> bit. The field counts up through byte 0, then into byte 1.</span>${helpBitGrid(0, 16, 1)}</div>
</div>
<p>So bytes <code>12 34</code> read as <b>0x1234</b> in Motorola 7|16 and as <b>0x3412</b> in Intel 0|16. A DBC line such as <code>SG_ Engine_Speed : 7|16@0+ (1,0)</code> means start 7, length 16, <code>@0</code> Motorola (<code>@1</code> Intel), <code>+</code> unsigned (<code>-</code> signed), factor 1, offset 0.</p>
<p>The bit grids in this page show bits 7 → 0 left to right, one row per byte; hover a cell to see its DBC bit number.</p>` },

  { id: 'recipes', group: 'How to', title: 'How-to recipes', html: `
<h4>Let a new chassis-side ID through to the ECU</h4>
<ol><li>ID sniffer → Start; find the ID on Bus A (it shows <i>Default: drop</i>).</li><li>Click <b>+ route</b>. On Routes, add a Note and, if the ECU doesn’t need every frame, a Min ms.</li><li>Send to board, check the sniffer now says <i>Row n: pass</i> and the ECU sees it, then Save.</li></ol>
<h4>Slow down a chatty frame</h4>
<p>Set <b>Min ms</b> on its route (e.g. 100 for 10 Hz). The newest data always wins. For mostly-static data use <b>On change</b> with a <b>Heartbeat</b> instead.</p>
<h4>Find which bit a button sets</h4>
<ol><li>ID sniffer → <b>What changed?</b> → Record background with nothing touched.</li><li>Start, press the button a few times, Stop. Do two or three tries.</li><li>The bit that appears in every try is the one. Click <b>analyze</b>, name it, Save signal.</li></ol>
<p>Without firmware 2.6: Sniffer → <b>monitor</b> on the ID, press the button a few times, and look for the bit analyzer cells that light up.</p>
<h4>Test settings at your desk with a recording from the car</h4>
<ol><li>In the car: Record &amp; replay → record everything on A RX (and B RX) for a few minutes of driving → Save as candump log.</li><li>At the desk, with only the ECU or the dash connected: load the log, set A RX to <i>Feed in as received on Bus A</i>, Start replay.</li><li>Watch the result with the frame monitor (B TX) or the Graph tab, change routes or transforms, Send, and replay again.</li></ol>
<h4>Find out what went wrong on a drive</h4>
<p>After the drive, connect (without power-cycling the isolator) and look at Status → <b>Event history</b>: bus state changes and error bursts are listed with the time they happened.</p>
<h4>Move a frame to another ID, or clear a bit</h4>
<p>Transforms → + Add transform → <i>Change the ID</i> and/or <i>Set a field to a value</i> (length 1, value 0 to clear). Check with Try it, pick it in the route’s Transform column, Send, Save.</p>
<h4>Build a frame the ECU used to send</h4>
<ol><li>Load the ECU’s DBC (DBC files tab).</li><li>Generated frames → + Add generated frame: ID, bus, period, constant bytes.</li><li>+ Field from a frame → pick the source by DBC signal name; <b>Work it out from units…</b> for the scaling; pick the destination bits in the grid.</li><li>Check the preview, turn it On, Send; on Status compare with the ECU’s copy (Check column), then Save and stop the ECU sending its own copy.</li></ol>
<h4>Test a change safely</h4>
<p>Send to board (RAM only) → test → Save, or <b>More… → Board: go back to saved settings</b>. A power cycle also discards unsaved changes.</p>
<h4>Back up your settings</h4>
<p><b>More… → Export settings to a file</b> saves routes, transforms, generated frames and your saved analyzer signals. Import loads them (also offline) for review before sending.</p>` },

  { id: 'update', group: 'How to', title: 'Updating the firmware', html: `
<ol>
<li><b>More… → Update firmware…</b> and choose <code>Firmware/CanIsolatorC6-&lt;version&gt;.bin</code> from the project folder (every PlatformIO build copies it there).</li>
<li>The page checks it’s isolator firmware and shows the old → new version (it warns about older versions).</li>
<li><b>Install</b>: about 10 seconds while the isolator keeps forwarding, then it restarts (about 1 s) and the page reconnects by itself.</li>
</ol>
<div class="callout"><b>Automatic rollback.</b> The new firmware must run properly for 10 seconds (both CAN controllers up, main loop alive) before it confirms itself. If it crashes or stalls first, the board goes back to the previous firmware on its own and the page says so. Settings are kept either way.</div>
<p>Do updates with the engine off: writing flash briefly pauses CAN reception. Boards older than firmware 2.4 need one USB flash with PlatformIO (<code>pio run -t upload</code> in CanIsolatorC6) to get the update slot.</p>` },

  { id: 'recovery', group: 'How to', title: 'Recovery and backups', html: `
<ul>
<li><b>Undo unsaved changes:</b> More… → Board: go back to saved settings, or power-cycle the isolator.</li>
<li><b>Factory defaults without saving:</b> More… → Board: run factory defaults (RAM only; Save to keep them).</li>
<li><b>Erase saved settings:</b> More… → Board: erase saved settings; the board starts on the factory defaults next time.</li>
<li><b>Factory reset without a computer:</b> hold the <b>BOOT</b> button for 3 seconds while the isolator is running. The LED flashes white, the saved settings are erased and it restarts on the defaults. <i>Don’t</i> hold BOOT while powering up: that starts the chip’s flashing mode instead (just power-cycle to leave it).</li>
<li><b>Damaged settings:</b> saved settings are checked (version, checksum, every field) at every boot; if they fail, the board runs the factory defaults and the top label says the saved settings were invalid. Settings saved by older firmware are upgraded automatically.</li>
<li><b>Backups:</b> More… → Export settings to a file. Keep one before big changes.</li>
</ul>` },

  { id: 'trouble', group: 'Reference', title: 'Troubleshooting', html: `
<h4>Connect does nothing / no port in the list</h4>
<ul><li>Use Chrome or Edge (the button says “Needs Chrome or Edge” in other browsers).</li><li>Close PlatformIO / Arduino serial monitors and any other tab with this page connected.</li><li>Try another USB-C cable (some only carry power) or port. If the board was held in BOOT at power-up, power-cycle it.</li><li><b>Windows:</b> Windows 10 and 11 install the driver by themselves the first time the board is plugged in (it appears in Device Manager under Ports as “USB Serial Device (COM…)”). If it says the port is in use, close any program holding that COM port.</li><li><b>Linux:</b> your user needs access to serial ports (usually the <code>dialout</code> group: <code>sudo usermod -aG dialout $USER</code>, then log in again).</li></ul>
<h4>A bus shows Error passive or Bus-off</h4>
<ul><li>Is the other node powered and connected? A bus with only the isolator on it can’t acknowledge frames.</li><li>Check CAN-H / CAN-L aren’t swapped and that the bus has 120 Ω at each end. The CANipulator’s termination is a solder jumper per channel, open from the factory; the ECU side usually needs it bridged.</li><li>Check both buses run the bit rate set on Bus settings.</li></ul>
<h4>A frame isn’t reaching the other side</h4>
<ul><li>ID sniffer: is it received at all, and what does the Route column say? <i>Default: drop</i> means no route; a row number means that row decided.</li><li>An earlier row may cover it (look for “never used” warnings), or the ID type (11/29-bit) or direction may not match.</li><li>A transform condition may be dropping it: test it with Try it.</li><li>Frame monitor with A TX / B TX shows exactly what the isolator sends.</li></ul>
<h4>A generated frame isn’t sent</h4>
<ul><li>Status → Generated frames: a rising <i>No source</i> means a source frame is missing or older than its stale time (e.g. the ECU is off), or shorter than the bits read.</li><li>Check the frame is <b>On</b> and the source bus and ID are right.</li></ul>
<h4>The monitor reports lost frames</h4><p>USB can’t carry a whole busy bus; add narrower filters.</p>
<h4>A replay shows Late or Pauses</h4><p>The page couldn’t stream frames fast enough: keep this tab in front (browsers slow down background tabs), close the sniffer and monitor while replaying, or lower the speed.</p>
<h4>Bus load is high</h4><p>Above about 70 % frames start to queue. Look for chatty IDs in the sniffer and slow them with Min ms on their routes; check that A → B isn’t forwarding unrouted IDs (Bus settings).</p>
<h4>An update failed or rolled back</h4><p>The board keeps running its previous firmware. Check the file is the app image (<code>CanIsolatorC6-x.y.z.bin</code>, not a merged/full-flash image), and that the cable stayed connected.</p>
<h4>The LED is blue while both buses have traffic</h4><p>With Bus A’s hardware filter on, only frames the isolator needs count as Bus A traffic.</p>` },

  { id: 'led', group: 'Reference', title: 'Status LED', html: `
<table class="help-table">
<tr><th>LED</th><th>Meaning</th></tr>
<tr><td><span class="ledsw" style="background:#2fbf5b"></span>Green</td><td>Frames received on both buses</td></tr>
<tr><td><span class="ledsw" style="background:#3b7ee8"></span>Blue</td><td>Frames received on one bus only</td></tr>
<tr><td><span class="ledsw" style="background:#e04848"></span>Red</td><td>A bus went error-passive or bus-off in the last half second</td></tr>
<tr><td><span class="ledsw" style="background:#555"></span>Off</td><td>No traffic on either bus</td></tr>
<tr><td><span class="ledsw" style="background:#c04cc0"></span>Magenta</td><td>The CAN driver failed to start</td></tr>
<tr><td><span class="ledsw" style="background:#eee;border:1px solid #999"></span>Flashing white</td><td>BOOT held 3 s: factory reset in progress</td></tr>
</table>` },

  { id: 'safety', group: 'Reference', title: 'Safety notes', html: `
<ul>
<li>The isolator sits between the ECU and the rest of the car. A wrong route, transform or generated frame can stop data the ECU, cluster or ABS-related functions rely on. Test changes with <b>Send to board</b> (RAM only) on the bench or with the car stationary before saving.</li>
<li>Save settings and update firmware with the engine off: flash writes briefly pause CAN reception.</li>
<li>Test frames go onto the real bus; use them deliberately.</li>
<li>Remove any bench link between CAN0 and CAN1 before installing in the car: forwarded frames would otherwise loop.</li>
<li>Keep an exported settings file as a known-good backup.</li>
</ul>` },

  { id: 'glossary', group: 'Reference', title: 'Glossary', html: `
<dl class="help-dl">
<dt>11-bit / 29-bit ID</dt><dd>Standard and extended CAN identifiers. The same number in each format is a different frame.</dd>
<dt>DLC / length</dt><dd>Number of data bytes in a frame, 0–8.</dd>
<dt>ACK</dt><dd>Every frame must be acknowledged by at least one other node; with nothing listening, the sender’s error counter climbs.</dd>
<dt>TEC / REC</dt><dd>Transmit / receive error counters. 0–95 active, 96+ warning, 128+ error passive, 256 bus-off.</dd>
<dt>Error passive</dt><dd>The node still works but may not signal errors loudly; usually caused by missing ACKs or wiring faults.</dd>
<dt>Bus-off</dt><dd>The controller removed itself from the bus after too many errors; the isolator restarts it automatically.</dd>
<dt>Termination</dt><dd>120 Ω between CAN-H and CAN-L at each physical end of a bus (about 60 Ω measured across a correctly terminated bus with power off).</dd>
<dt>Whitelist</dt><dd>Only explicitly routed IDs pass; the default for A → B.</dd>
<dt>Rolling counter</dt><dd>A field that steps every frame so receivers can detect missing or repeated frames.</dd>
<dt>Motorola / Intel</dt><dd>Big-endian / little-endian bit ordering of a signal; see <i>Bit numbering</i>.</dd>
<dt>Hardware filter</dt><dd>The CAN controller’s acceptance filter: frames it rejects never reach the CPU.</dd>
<dt>Rollback</dt><dd>Returning to the previous firmware automatically when a new one doesn’t confirm itself.</dd>
<dt>Bus load</dt><dd>The share of the time a bus is busy carrying frames. 500 kbit/s carries about 4,000 8-byte frames a second at 100 %.</dd>
<dt>candump log</dt><dd>The text log format of Linux can-utils: one frame per line with a timestamp, interface and <code>ID#data</code>. Most CAN tools can open it.</dd>
<dt>Feed in (replay)</dt><dd>Replaying a frame into the isolator as if it had been received on a bus, so it goes through the routes and transforms.</dd>
</dl>` },
];

const HELP_FOR_TAB = { status: 'status', routes: 'routes', transforms: 'transforms', buttons: 'buttons', generated: 'generated', settings: 'settings',
                       sniffer: 'sniffer', monitor: 'monitor', send: 'send', dbc: 'dbc', firmware: 'update', help: 'start', graph: 'graph', replay: 'replay' };
let helpQuery = '', helpBackTab = 'status';

function helpBitGrid(start, len, order) {
  const pos = new Set(sigPositions({ start, len, order: order ? 'intel' : 'motorola' }) || []);
  let rows = '';
  for (let by = 0; by < 3; by++) {
    rows += `<tr><th>byte ${by}</th>`;
    for (let bit = 7; bit >= 0; bit--) {
      const p = by * 8 + bit, on = pos.has(p);
      rows += `<td class="hb${on ? ' on' : ''}${p === start ? ' st' : ''}" title="DBC bit ${p}">${p}</td>`;
    }
    rows += '</tr>';
  }
  return `<table class="help-grid"><tr><th></th>${[7, 6, 5, 4, 3, 2, 1, 0].map(b => `<th>${b}</th>`).join('')}</tr>${rows}</table>`;
}

function openHelp(sectionId) {
  if (state.tab !== 'help') helpBackTab = state.tab;
  state.tab = 'help'; helpQuery = '';
  renderTab(false);
  const el = document.getElementById('help-' + (sectionId || 'start'));
  if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); }
}

function helpView() {
  const q = helpQuery.trim().toLowerCase();
  const text = (s) => s.html.replace(/<[^>]+>/g, ' ').replace(/\$\{[^}]+\}/g, '').toLowerCase();

  const groups = ['Basics', 'Tabs', 'How to', 'Reference'].filter(g => HELP.some(s => s.group === g));
  const toc = h('div', { class: 'help-toc' },
    h('input', { placeholder: 'Search help…', value: helpQuery, oninput: (e) => {
      helpQuery = e.target.value; const pos = e.target.selectionStart; renderTab(false);
      const el = $('.help-toc input'); el.focus(); el.setSelectionRange(pos, pos); } }),
    groups.map(g => h('div', {}, h('div', { class: 'help-group' }, g),
      HELP.filter(s => s.group === g).map(s => h('a', { href: '#', class: matches.includes(s) ? '' : 'dim',
        onclick: (e) => { e.preventDefault(); helpQuery = ''; openHelp(s.id); } }, s.title)))));
  const body = h('div', { class: 'help-body' },
    h('div', { class: 'toolbar' },
      helpBackTab && helpBackTab !== 'help' ? h('button', { onclick: () => { state.tab = helpBackTab; renderTab(false); } }, '← Back to ' + (document.querySelector(`#tabs button[data-tab="${helpBackTab}"]`)?.textContent || helpBackTab)) : null,
      q ? h('span', { class: 'muted' }, `${matches.length} section${matches.length === 1 ? '' : 's'} match “${helpQuery}”`) : null),
    matches.length ? matches.map(s => {
      const sec = h('section', { class: 'panel help-sec', id: 'help-' + s.id }, h('h2', {}, s.title));
      const div = document.createElement('div');
      div.innerHTML = s.html;
      if (q) highlightText(div, q);
      sec.append(div);
      return sec;
    }) : h('div', { class: 'panel' }, h('p', { class: 'muted', style: 'margin:0' }, 'Nothing matches. Try a shorter word.')),
    h('p', { class: 'hint' }, `Page and firmware: ${state.hello ? state.hello.fw + ' ' + state.hello.ver : 'not connected'}. The full protocol is documented at handleCommand() in CanIsolatorC6.ino; the README in the ConfigTool folder has a short version of this guide.`));
  return h('div', { class: 'help-wrap' }, toc, body);
}

// Wrap matches of q in <mark> inside text nodes (not inside tags).
function highlightText(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const t = n.nodeValue, i = t.toLowerCase().indexOf(q);
    if (i < 0) continue;
    const frag = document.createDocumentFragment();
    let last = 0, j = i;
    while (j >= 0) {
      frag.append(t.slice(last, j));
      const mk = document.createElement('mark'); mk.textContent = t.slice(j, j + q.length); frag.append(mk);
      last = j + q.length; j = t.toLowerCase().indexOf(q, last);
    }
    frag.append(t.slice(last));
    n.parentNode.replaceChild(frag, n);
  }
}

// ===========================================================================
// Firmware 2.6 features: helpers
// ===========================================================================
const has = (f) => !!state.hello?.features?.includes(f);
// Background traffic (monitor, replay) doesn't stop the once-a-second status poll.
function lockedBg(fn) { return locked(async () => { link.bg++; try { return await fn(); } finally { link.bg--; } }); }
const fmtDur = (ms) => ms < 1000 ? ms + ' ms' : ms < 60000 ? (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + ' s' : ms < 3600000 ? `${Math.floor(ms / 60000)} min ${Math.round(ms / 1000) % 60} s` : `${Math.floor(ms / 3600000)} h ${Math.floor(ms / 60000) % 60} min`;
const fmtClock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function downloadText(text, name, type) {
  const blob = new Blob([text], { type: type || 'text/plain' });
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 19).replace(/:/g, '');

// ===========================================================================
// Time-series chart: one or more series on one y axis, hover crosshair,
// optional crosshair sync across charts (same 'sync' group).
// ===========================================================================
const chartSync = new Map();          // group -> [{ show(t), hide() }]
function tsChart(o) {
  const series = o.series.filter(s => s.pts.length);
  const multi = o.series.length > 1;
  const W = o.width || 760, H = o.height || 170, L = 58, R = multi ? 92 : 14, T = 10, B = 24;
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, a, txt) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt !== undefined) e.textContent = txt; return e; };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': o.label || 'chart' });
  const wrap = h('div', { class: 'chart-wrap' });
  if (multi) wrap.append(h('div', { class: 'legend' }, o.series.map(s => h('span', {}, h('i', { style: `background:${s.color}` }), s.name))));
  if (!series.length) { wrap.append(h('p', { class: 'hint', style: 'margin:6px 0' }, o.empty || 'No data yet.')); return wrap; }
  const t0 = o.t0 ?? Math.min(...series.map(s => s.pts[0].t)), t1 = Math.max(o.t1 ?? -Infinity, ...series.map(s => s.pts[s.pts.length - 1].t), t0 + 1e-6);
  // Reduce to ~2 points per pixel column (min and max), so spikes survive.
  const reduce = (pts) => {
    if (pts.length <= 1400) return pts;
    const n = 600, out = [], w = (t1 - t0) / n;
    let b = -1, lo = null, hi = null;
    const flush = () => { if (lo) { if (lo === hi) out.push(lo); else if (lo.t <= hi.t) out.push(lo, hi); else out.push(hi, lo); } };
    for (const p of pts) {
      const k = Math.min(n - 1, Math.floor((p.t - t0) / w));
      if (k !== b) { flush(); b = k; lo = hi = p; }
      else { if (p.v < lo.v) lo = p; if (p.v > hi.v) hi = p; }
    }
    flush();
    return out;
  };
  const red = series.map(s => ({ ...s, pts: reduce(s.pts) }));
  let lo = o.yMin ?? Math.min(...red.map(s => Math.min(...s.pts.map(p => p.v))));
  let hi = o.yMax ?? Math.max(...red.map(s => Math.max(...s.pts.map(p => p.v))));
  if (o.yMinCap !== undefined) hi = Math.max(hi, o.yMinCap);
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(k => k * mag).find(x => x >= raw);
  lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step;
  const X = (t) => L + (t - t0) / (t1 - t0) * (W - L - R);
  const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const fmtV = o.fmtV || ((v) => Number.isInteger(v) ? String(v) : v.toFixed(2));
  const fmtT = o.fmtT || ((t) => t.toFixed(1) + ' s');
  for (let v = lo; v <= hi + step / 2; v += step) {
    const y = Y(v);
    svg.append(el('line', { x1: L, x2: W - R, y1: y, y2: y, class: 'grid' }));
    svg.append(el('text', { x: L - 6, y: y + 4, 'text-anchor': 'end', class: 'axis' }, (o.fmtAxis || fmtV)(Math.round(v / step) * step)));
  }
  let lastTick = '';
  for (let i = 0; i <= 4; i++) {
    const t = t0 + (t1 - t0) * i / 4, txt = fmtT(t);
    if (txt === lastTick) continue;
    lastTick = txt;
    svg.append(el('text', { x: X(t), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle', class: 'axis' }, txt));
  }
  for (const s of red) {
    svg.append(el('path', { d: s.pts.map((q, i) => (i ? 'L' : 'M') + X(q.t).toFixed(1) + ' ' + Y(q.v).toFixed(1)).join(''), class: 'series', style: `stroke:${s.color}` }));
    if (multi) {
      const last = s.pts[s.pts.length - 1];
      svg.append(el('text', { x: X(last.t) + 6, y: Y(last.v) + 4, class: 'dlabel' }, `${s.name} ${fmtV(last.v)}`));
    }
  }
  const cross = el('line', { y1: T, y2: H - B, class: 'cross', visibility: 'hidden' });
  svg.append(cross);
  const dots = red.map(s => { const d = el('circle', { r: 4, class: 'dot', style: `fill:${s.color}`, visibility: 'hidden' }); svg.append(d); return d; });
  const tip = h('div', { class: 'tip', hidden: true });
  const hit = el('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' });
  svg.append(hit);
  const nearest = (pts, t) => { let a = 0, b = pts.length - 1; while (b - a > 1) { const m = (a + b) >> 1; if (pts[m].t < t) a = m; else b = m; } return Math.abs(pts[a].t - t) <= Math.abs(pts[b].t - t) ? pts[a] : pts[b]; };
  const show = (t) => {
    if (t < t0 || t > t1) { hide(); return; }
    const cx = X(t);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    const parts = [fmtT(t)];
    let ty = H;
    red.forEach((s, i) => {
      const q = nearest(s.pts, t);
      dots[i].setAttribute('cx', X(q.t)); dots[i].setAttribute('cy', Y(q.v)); dots[i].setAttribute('visibility', 'visible');
      parts.push((multi ? s.name + ' ' : '') + (s.text ? s.text(q) : fmtV(q.v)));
      ty = Math.min(ty, Y(q.v));
    });
    const r = svg.getBoundingClientRect();
    tip.hidden = false; tip.textContent = parts.join(' · ');
    tip.style.left = Math.min(Math.max(0, r.width - tip.offsetWidth - 4), Math.max(0, cx / W * r.width + 10)) + 'px';
    tip.style.top = Math.max(0, ty / H * r.height - 30) + 'px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); dots.forEach(d => d.setAttribute('visibility', 'hidden')); tip.hidden = true; };
  const peers = () => o.sync ? (chartSync.get(o.sync) || []) : [];
  const me = { show, hide };
  if (o.sync) { if (!chartSync.has(o.sync)) chartSync.set(o.sync, []); chartSync.get(o.sync).push(me); }
  hit.addEventListener('mousemove', (ev) => {
    const r = svg.getBoundingClientRect();
    const t = t0 + ((ev.clientX - r.left) / r.width * W - L) / (W - L - R) * (t1 - t0);
    show(t); for (const p of peers()) if (p !== me) p.show(t);
  });
  hit.addEventListener('mouseenter', () => { chartHover = true; });
  hit.addEventListener('mouseleave', () => { chartHover = false; hide(); for (const p of peers()) p.hide(); });
  wrap.append(svg, tip);
  return wrap;
}

// ===========================================================================
// Status: bus load and event history
// ===========================================================================
const LOAD_KEEP = 900;                // points kept (15 min at one a second)
function loadUpdate(s, prev) {
  if (!has('load') || !prev) return;
  if (s.up < prev.up) { state.loadHist = []; return; }          // board restarted
  const dt = (s.up - prev.up) / 1000;
  if (dt <= 0) return;
  const baud = state.board?.hw?.baud || [500000, 500000];
  state.loadHist.push({ t: Date.now(), v: [0, 1].map(i => Math.min(100, ((s.bus[i].bits - prev.bus[i].bits) >>> 0) / dt / baud[i] * 100)),
                        pk: s.bus.map(b => Math.min(100, (b.pk || 0) / 10)) });
  if (state.loadHist.length > LOAD_KEEP) state.loadHist.shift();
}

async function evUpdate(s) {
  if (!has('ev') || s.ev === undefined || s.ev === state.evN) return;
  try { const r = await cmd.ev(); state.events = { ...r, at: Date.now() }; state.evN = r.n; } catch {}
}

const EV_STATE = [
  ['ok', 'Back to normal', 'Error active again.'],
  ['warn', 'Error warning', 'Errors are building up (96 or more).'],
  ['bad', 'Error passive', 'Its frames aren’t being acknowledged, or wiring / termination trouble.'],
  ['bad', 'Bus-off', 'Too many errors: it stopped sending and is recovering by itself.'],
];
function evInfo(e) {
  const [t, t2, bus, kind, a, count] = e;
  const span = t2 > t ? ` over ${fmtDur(t2 - t)}` : '';
  switch (kind) {
    case 0: return { sev: '', what: 'Isolator started', detail: state.hello ? `Reset reason: ${state.hello.reset}.` : '' };
    case 1: { const s = EV_STATE[a] || ['', 'State ' + a, '']; return { sev: s[0], what: s[1], detail: s[2] }; }
    case 2: return { sev: 'warn', what: 'Bus errors', detail: `${count.toLocaleString()} error frames${span}. Usually wiring, termination, a wrong bit rate or electrical noise.` };
    case 3: return { sev: 'bad', what: 'RX overflow', detail: `${count.toLocaleString()} received frames lost${span}: the isolator couldn’t keep up.` };
    case 4: return { sev: 'warn', what: 'TX overflow', detail: `${count.toLocaleString()} frames not queued${span}: the bus is too busy or nothing acknowledges.` };
    case 5: return { sev: 'warn', what: 'Stale frames dropped', detail: `${count.toLocaleString()} frames waited longer than the TX max age${span}.` };
    default: return { sev: '', what: 'Event ' + kind, detail: '' };
  }
}

function loadPanel() {
  if (!has('load')) return null;
  const hist = state.loadHist;
  const now = hist[hist.length - 1];
  const series = [0, 1].map(i => ({ name: i ? 'Bus B' : 'Bus A', color: i ? 'var(--busB)' : 'var(--busA)', pts: hist.map(p => ({ t: p.t, v: p.v[i] })) }));
  const peak = [0, 1].map(i => hist.slice(-60).reduce((m, p) => Math.max(m, p.pk[i]), 0));
  return h('div', { class: 'panel' },
    h('h2', {}, 'Bus load'),
    h('p', { class: 'hint' }, 'Share of each bus’s capacity in use, worked out from the frames the isolator receives and sends (approximate). Peak is the busiest 100 ms. Frames rejected by Bus A’s hardware filter aren’t counted, so Bus A reads low while the filter is on. Kept in this page while it is connected.'),
    h('div', { class: 'kv' },
      [0, 1].map(i => [kv(`Bus ${i ? 'B' : 'A'} now`, now ? now.v[i].toFixed(1) + ' %' : '–'), kv(`Bus ${i ? 'B' : 'A'} peak, last minute`, now ? peak[i].toFixed(1) + ' %' : '–', true, peak[i] > 80)])),
    hist.length > 1 ? tsChart({ series, width: 1300, height: 190, yMin: 0, yMinCap: 10, label: 'Bus load over time',
      fmtV: (v) => (Math.round(v * 10) / 10) + ' %', fmtT: (t) => fmtClock(t) }) : h('p', { class: 'hint', style: 'margin:8px 0 0' }, 'Collecting…'));
}

function eventsPanel() {
  if (!has('ev')) return null;
  const E = state.events;
  const list = E ? [...E.e].reverse() : [];
  const rows = list.map(e => {
    const x = evInfo(e);
    const wall = E.at - (E.up - e[0]);
    return h('tr', {},
      h('td', { class: 'num', title: `${fmtUp(e[0])} after the isolator started` }, fmtClock(wall)),
      h('td', {}, e[3] === 0 ? '–' : e[2] ? 'B' : 'A'),
      h('td', {}, h('span', { class: 'badge ' + x.sev }, x.what)),
      h('td', { class: 'muted', style: 'font-size:13px' }, x.detail));
  });
  return h('div', { class: 'panel' },
    h('h2', {}, 'Event history'),
    h('p', { class: 'hint' }, 'Bus trouble the isolator has seen since it last started, newest first, including while this page wasn’t connected. Kept in the isolator’s memory (last 64 entries) and cleared when it loses power.' +

        h('tbody', {}, rows.length ? rows : h('tr', {}, h('td', { colspan: 4, class: 'muted' }, E ? 'Nothing yet.' : 'Loading…'))))));

// ===========================================================================
// ID sniffer: "What changed?"
// ===========================================================================
function applySniff(d, phase) {
  const now = Date.now();
  for (const o of d) {
    const map = state.sniff[o.b];
    for (const [id, ext, count, len, data, chg] of o.ids) {
      const k = ext + ':' + id;
      const e = map.get(k) || { id, ext, first: now };
      e.hz = o.dt ? count * 1000 / o.dt : 0; e.len = len; e.data = data;
      if (count) e.seen = now;
      map.set(k, e);
      chgAccumulate(phase, o.b, id, ext, len, data, chg, count);
    }
    state.sniffLost[o.b] = o.lost;
  }
}
async function sniffNow() {
  const phase = state.chg.phase;
  applySniff(await cmd.sniff(), phase);
}

function chgAccumulate(phase, bus, id, ext, len, data, chg, count) {
  const C = state.chg;
  if ((phase !== 'base' && phase !== 'act') || !(C.buses & (1 << bus)) || !count) return;
  const map = phase === 'base' ? C.base : C.cur;
  if (!map) return;
  const k = bus + ':' + ext + ':' + id;
  const e = map.get(k) || { bus, id, ext, mask: [0, 0, 0, 0, 0, 0, 0, 0] };
  const c = bytesOf(chg || '');
  for (let i = 0; i < 8; i++) e.mask[i] |= c[i] || 0;
  e.data = data; e.len = len;
  map.set(k, e);
}
const popcount = (m) => m.reduce((a, v) => { let n = 0; while (v) { n += v & 1; v >>= 1; } return a + n; }, 0);

function chgResults() {
  const C = state.chg, agg = new Map();
  C.tries.forEach((T) => {
    for (const [k, e] of T) {
      const b = C.base.get(k);
      const mask = e.mask.map((v, i) => v & ~(b ? b.mask[i] : 0));
      if (!popcount(mask) && b) continue;
      const a = agg.get(k) || { bus: e.bus, id: e.id, ext: e.ext, hits: 0, mask: [0, 0, 0, 0, 0, 0, 0, 0], isNew: !b };
      a.hits++; a.data = e.data; a.len = e.len;
      mask.forEach((v, i) => a.mask[i] |= v);
      agg.set(k, a);
    }
  });
  return [...agg.values()].sort((x, y) => y.hits - x.hits || (popcount(x.mask) || 99) - (popcount(y.mask) || 99) || x.bus - y.bus || x.id - y.id);
}

async function chgStartBase() {
  const C = state.chg;
  if (!has('chg')) { toast('“What changed?” needs isolator firmware 2.6 or newer (More… → Update firmware).', true); return; }
  if (!C.buses) { toast('Tick Bus A and/or Bus B.', true); return; }
  try {
    if (!state.sniffOn) { await cmd.simple('sniff on'); state.sniffOn = true; state.sniff = [new Map(), new Map()]; }
    await sniffNow();                                  // start from a clean slate
  } catch (e) { toast(e.message, true); return; }
  C.base = new Map(); C.tries = []; C.cur = null; C.phase = 'base'; C.t0 = Date.now();
  clearInterval(C.timer);
  C.timer = setInterval(() => { if (Date.now() - C.t0 >= C.baseSecs * 1000) chgEndBase(); else chgRefresh(); }, 250);
  renderTab(false);
}
async function chgEndBase() {
  const C = state.chg;
  clearInterval(C.timer); C.timer = null;
  try { await sniffNow(); } catch {}
  C.phase = 'ready'; renderTab(false);
}
async function chgStartAct() {
  const C = state.chg;
  try { await sniffNow(); } catch {}                   // changes before this moment don't count
  C.cur = new Map(); C.phase = 'act'; C.t0 = Date.now();
  clearInterval(C.timer); C.timer = setInterval(chgRefresh, 250);
  renderTab(false);
}
async function chgStopAct() {
  const C = state.chg;
  clearInterval(C.timer); C.timer = null;
  try { await sniffNow(); } catch {}
  C.tries.push(C.cur); C.cur = null; C.phase = 'ready';
  renderTab(false);
}
function chgRefresh() { const p = $('#chgPanel'); if (p) p.replaceWith(chgPanel()); }

// First contiguous run of changed bits (Intel numbering), for the analyzer.
function chgFirstField(mask) {
  for (let by = 0; by < 8; by++) {
    if (!mask[by]) continue;
    let lo = 0; while (!((mask[by] >> lo) & 1)) lo++;
    let hi = lo; while (hi < 7 && ((mask[by] >> (hi + 1)) & 1)) hi++;
    return { order: 'intel', start: by * 8 + lo, len: hi - lo + 1 };
  }
  return null;
}

function chgBitsView(r) {
  const b = bytesOf(r.data || '');
  const rows = [];
  for (let by = 0; by < 8; by++) {
    if (!r.mask[by]) continue;
    rows.push(h('tr', {}, h('th', {}, 'byte ' + by), [7, 6, 5, 4, 3, 2, 1, 0].map(bit => {
      const on = (r.mask[by] >> bit) & 1;
      return h('td', { class: 'cb' + (on ? ' on' : ''), title: on ? `byte ${by}, bit ${bit} (DBC bit ${by * 8 + bit}) changed` : '' }, ((b[by] ?? 0) >> bit) & 1);
    })));
  }
  return rows.length ? h('table', { class: 'chgbits' }, h('tbody', {}, rows)) : h('span', { class: 'muted' }, 'no single bits: the ID itself only appeared during the action');
}

    onchange: (e) => { C.buses = e.target.checked ? C.buses | bit : C.buses & ~bit; } }), ' ', name);
  const left = Math.max(0, C.baseSecs - (Date.now() - C.t0) / 1000);
  const baseIds = C.base.size, noisy = [...C.base.values()].filter(e => popcount(e.mask)).length, noiseBits = [...C.base.values()].reduce((a, e) => a + popcount(e.mask), 0);
  const res = C.tries.length ? chgResults() : [];
  const step1 =
    C.phase === 'base' ? [h('span', { class: 'badge warn' }, `Recording background… ${Math.ceil(left)} s`), ' ', h('button', { class: 'small', onclick: chgEndBase }, 'Done early')]
    : [h('button', { class: C.phase === 'idle' ? 'primary' : '', disabled: !state.connected || C.phase === 'act', onclick: chgStartBase }, C.phase === 'idle' ? 'Record background' : 'Record background again'),
       ' for ', h('input', { class: 'ms', value: C.baseSecs, oninput: (e) => { const v = parseIntSafe(e.target.value); if (v >= 2 && v <= 120) C.baseSecs = v; } }), ' s',

    : [h('button', { class: C.phase === 'ready' ? 'primary' : '', disabled: C.phase !== 'ready', onclick: chgStartAct }, C.tries.length ? `Start try ${C.tries.length + 1}` : 'Start'),
       C.tries.length ? h('button', { class: 'small', style: 'margin-left:8px', onclick: () => { C.tries = []; renderTab(false); } }, 'Clear tries') : null,
       h('span', { class: 'muted', style: 'margin-left:10px' }, C.phase === 'ready' ? 'Press Start, do the thing a few times (press the button, flip the switch…), then Stop.' : 'Record the background first.')];
  const rows = res.slice(0, 60).map(r => {
    const v = routeVerdict(state.edit, r.bus, r.id, r.ext);
    return h('tr', {},

        } }, 'analyze'), ' ',
        v.row === -1 ? h('button', { class: 'small', title: 'Add a route row for this ID', onclick: () => { addRoute({ first: r.id, ext: r.ext, dir: r.bus === 0 ? 1 : 2 }); toast(`Added row for ${fmtId(r.id, r.ext)}. Send to board to use it.`); } }, '+ route') : null));
  });
  return h('div', { class: 'panel', id: 'chgPanel' },
    h('h2', {}, 'What changed?'),
